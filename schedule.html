<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch thi đấu - SportsVN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f2f8; min-height: 100vh; padding: 24px; }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #0d1b3e, #1a3a7a);
            border-radius: 20px; padding: 28px 32px; color: #fff;
            margin-bottom: 24px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 16px;
        }
        .header h1 { font-size: 26px; margin-bottom: 6px; }
        .header p { opacity: 0.85; font-size: 14px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 11px 22px; border-radius: 10px; font-size: 14px;
            font-weight: 700; cursor: pointer; border: none;
            transition: all 0.3s ease; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-outline { background: transparent; color: #fff; border: 2px solid #fff; }
        .btn-outline:hover { background: #fff; color: #0d1b3e; }
        .btn-success { background: #00b894; color: #fff; }
        .stats-bar {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .stat-card {
            background: #fff; border-radius: 14px; padding: 18px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .stat-card .label { font-size: 12px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .stat-card .value { font-size: 26px; font-weight: 800; color: #1a3a7a; }
        .stat-card .sub { font-size: 12px; color: #6c757d; margin-top: 4px; }
        .schedule-panel { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .day-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
        .day-tab {
            padding: 12px 20px; border-radius: 10px; cursor: pointer;
            font-weight: 700; font-size: 14px; color: #6c757d;
            background: #f8f9fa; border: 2px solid transparent;
            white-space: nowrap; transition: all 0.2s ease;
            min-width: 140px; text-align: center;
        }
        .day-tab:hover { border-color: #1a3a7a; color: #1a3a7a; }
        .day-tab.active { background: linear-gradient(135deg, #0d1b3e, #1a3a7a); color: #fff; border-color: #1a3a7a; }
        .day-tab small { display: block; font-size: 11px; opacity: 0.7; margin-top: 2px; }
        .session-section { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px dashed #e9ecef; }
        .session-section:last-child { border-bottom: none; margin-bottom: 0; }
        .session-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; padding: 10px 14px;
            background: #f8f9fa; border-radius: 10px;
            border-left: 4px solid #1a3a7a;
        }
        .session-header h3 { font-size: 16px; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
        .session-header .session-time { font-size: 13px; color: #6c757d; font-weight: 600; }
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .court-card { background: #f8f9fa; border-radius: 10px; padding: 12px; border: 2px solid #e9ecef; min-height: 100px; }
        .court-card.has-match { background: #fff; border-color: #1a3a7a; }
        .court-card .court-name {
            font-size: 12px; font-weight: 800; color: #1a3a7a;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .court-card .court-name .time { font-size: 11px; color: #6c757d; font-weight: 600; text-transform: none; }
        .match-box {
            background: linear-gradient(135deg, #0d1b3e, #1a3a7a);
            color: #fff; border-radius: 8px; padding: 10px;
            font-size: 12px; line-height: 1.4;
        }
        .match-box .category { font-size: 10px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 700; }
        .match-box .teams { display: flex; flex-direction: column; gap: 3px; }
        .match-box .team { display: flex; justify-content: space-between; font-weight: 600; }
        .match-box .vs { font-size: 10px; text-align: center; opacity: 0.6; margin: 2px 0; }
        .match-box .round-badge {
            display: inline-block; font-size: 9px; padding: 2px 6px;
            background: rgba(255,255,255,0.2); border-radius: 4px;
            margin-top: 6px; font-weight: 700;
        }
        .empty-court { color: #adb5bd; font-size: 12px; text-align: center; padding: 18px 0; font-style: italic; }
        .empty-state { text-align: center; padding: 80px 20px; color: #6c757d; }
        .empty-state i { font-size: 72px; color: #dee2e6; margin-bottom: 20px; display: block; }
        .empty-state h3 { font-size: 20px; color: #1a1a2e; margin-bottom: 10px; font-weight: 700; }
        .empty-state p { margin-bottom: 20px; font-size: 15px; }
        .alert { padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; display: none; font-size: 14px; }
        .alert.show { display: block; }
        .alert.error { background: #f8d7da; color: #721c24; }
        .alert.success { background: #d4edda; color: #155724; }
        .alert.info { background: #cce5ff; color: #004085; }
        .loading { text-align: center; padding: 60px 20px; color: #6c757d; }
        .loading i { font-size: 48px; color: #dee2e6; animation: spin 1s linear infinite; display: block; margin-bottom: 16px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>📅 Lịch thi đấu</h1>
            <p id="tournament-name">Đang tải...</p>
        </div>
        <div class="header-actions">
            <a href="tournaments.html" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
            <button class="btn btn-success" onclick="autoGenerateSchedule()">
                <i class="fas fa-magic"></i> Tự động xếp lịch
            </button>
            <button class="btn btn-primary" onclick="exportScheduleExcel()">
                <i class="fas fa-file-export"></i> Xuất Excel
            </button>
        </div>
    </div>

    <div id="alert" class="alert"></div>
    <div class="stats-bar" id="stats-bar"></div>

    <div class="schedule-panel">
        <div id="loading" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Đang tải lịch thi đấu...</p>
        </div>

        <div id="schedule-content" style="display: none;">
            <div class="day-tabs" id="day-tabs"></div>
            <div id="schedule-sections"></div>
        </div>

        <div id="empty-schedule" class="empty-state" style="display: none;">
            <i class="fas fa-calendar-times"></i>
            <h3>Chưa có lịch thi đấu</h3>
            <p>Bạn cần bốc thăm trước, sau đó nhấn "Tự động xếp lịch" để tạo lịch thi đấu.</p>
            <a href="#" id="draw-link" class="btn btn-success" style="font-size: 16px; padding: 14px 28px;">
                <i class="fas fa-dice"></i> Đi tới bốc thăm
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function() {
    'use strict';

    console.log('🚀 schedule.html v4 - FULL FIXED');

    const config = window.SPORTSVN_CONFIG || {};
    if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
        document.getElementById('loading').innerHTML = '<p style="color: #e94560;">Lỗi cấu hình Supabase</p>';
        return;
    }

    const supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);

    let currentUser = null;
    let tournamentId = null;
    let tournament = null;
    let schedules = [];
    let draws = [];
    let categories = [];
    let venues = [];
    let selectedDay = 1;

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        tournamentId = urlParams.get('tournament_id');

        if (!tournamentId) { showError('Thiếu ID giải đấu!'); return; }

        document.getElementById('draw-link').href = `draw.html?tournament_id=${tournamentId}`;

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        await loadData();
    }

    async function loadData() {
        try {
            const { data: tour } = await supabaseClient
                .from('tournaments').select('*').eq('id', tournamentId).single();
            tournament = tour;

            document.getElementById('tournament-name').textContent =
                `${tournament.name} · ${tournament.num_venues || 0} sân · ${tournament.num_days || 0} ngày · ${tournament.sessions_per_day || 0} buổi/ngày`;

            const { data: cats } = await supabaseClient.from('categories').select('*').eq('tournament_id', tournamentId);
            categories = cats || [];

            const { data: vens } = await supabaseClient.from('venues').select('*').eq('tournament_id', tournamentId).order('court_number');
            venues = vens || [];

            const { data: scheds } = await supabaseClient.from('schedules').select('*').eq('tournament_id', tournamentId).order('match_date').order('start_time');
            schedules = scheds || [];

            const { data: drawsData } = await supabaseClient.from('draws').select('*').eq('tournament_id', tournamentId);
            draws = drawsData || [];

            console.log('📊 Data:', {
                categories: categories.length,
                venues: venues.length,
                schedules: schedules.length,
                draws: draws.length
            });

            render();
        } catch (error) {
            console.error('❌', error);
            showError('Lỗi tải dữ liệu: ' + error.message);
        }
    }

    function render() {
        document.getElementById('loading').style.display = 'none';

        if (schedules.length === 0) {
            document.getElementById('empty-schedule').style.display = 'block';
            document.getElementById('schedule-content').style.display = 'none';
            renderStats();
            return;
        }

        document.getElementById('empty-schedule').style.display = 'none';
        document.getElementById('schedule-content').style.display = 'block';
        renderStats();
        renderDayTabs();
        renderScheduleSections();
    }

    function renderStats() {
        const statsBar = document.getElementById('stats-bar');
        const completedMatches = schedules.filter(s => s.status === 'completed').length;
        const uniqueDates = [...new Set(schedules.map(s => s.match_date))].sort();

        statsBar.innerHTML = `
            <div class="stat-card">
                <div class="label">Tổng trận đấu</div>
                <div class="value">${schedules.length}</div>
                <div class="sub">Đã hoàn thành: ${completedMatches}</div>
            </div>
            <div class="stat-card">
                <div class="label">Sân thi đấu</div>
                <div class="value">${venues.length}</div>
                <div class="sub">${tournament?.venue_name || 'Chưa đặt tên'}</div>
            </div>
            <div class="stat-card">
                <div class="label">Số ngày</div>
                <div class="value">${uniqueDates.length}</div>
                <div class="sub">Từ ${formatDate(uniqueDates[0])}</div>
            </div>
            <div class="stat-card">
                <div class="label">Nội dung</div>
                <div class="value">${categories.length}</div>
                <div class="sub">Đã bốc thăm: ${draws.length > 0 ? 'Có' : 'Chưa'}</div>
            </div>
        `;
    }

    function renderDayTabs() {
        const uniqueDates = [...new Set(schedules.map(s => s.match_date))].sort();
        const tabsEl = document.getElementById('day-tabs');

        tabsEl.innerHTML = uniqueDates.map((date, i) => {
            const dayNum = i + 1;
            const matchCount = schedules.filter(s => s.match_date === date).length;
            const isActive = selectedDay === dayNum;
            return `
                <button class="day-tab ${isActive ? 'active' : ''}" onclick="selectDay(${dayNum}, '${date}')">
                    📅 Ngày ${dayNum}<br>
                    <small>${formatDate(date)} · ${matchCount} trận</small>
                </button>
            `;
        }).join('');
    }

    window.selectDay = function(dayNum, date) {
        selectedDay = dayNum;
        renderDayTabs();
        renderScheduleSections(date);
    };

    function renderScheduleSections(specificDate) {
        const uniqueDates = [...new Set(schedules.map(s => s.match_date))].sort();
        const currentDate = specificDate || uniqueDates[selectedDay - 1];
        if (!currentDate) return;

        const daySchedules = schedules.filter(s => s.match_date === currentDate);
        const sessions = getSessions();
        const container = document.getElementById('schedule-sections');

        container.innerHTML = sessions.map(session => {
            const sessionSchedules = daySchedules.filter(s => s.session === session.key);
            return `
                <div class="session-section">
                    <div class="session-header">
                        <h3><i class="fas fa-${session.icon}"></i> ${session.label}</h3>
                        <span class="session-time">${session.time} · ${sessionSchedules.length} trận</span>
                    </div>
                    <div class="courts-grid">
                        ${renderCourtsForSession(sessionSchedules)}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderCourtsForSession(sessionSchedules) {
        if (venues.length === 0) return '<div class="empty-court" style="grid-column: 1/-1;">Chưa có sân.</div>';

        return venues.map(venue => {
            const matchAtCourt = sessionSchedules.find(s => s.venue_id === venue.id);

            if (matchAtCourt) {
                const displayCategory = matchAtCourt.notes || '';
                return `
                    <div class="court-card has-match">
                        <div class="court-name">
                            <span>${escapeHtml(venue.court_name || 'Sân ' + venue.court_number)}</span>
                            <span class="time">${formatTime(matchAtCourt.start_time)}</span>
                        </div>
                        <div class="match-box">
                            ${displayCategory ? `<div class="category">${escapeHtml(displayCategory)}</div>` : ''}
                            <div class="teams">
                                <div class="team"><span>${escapeHtml(matchAtCourt.team_a_name || '—')}</span></div>
                                <div class="vs">VS</div>
                                <div class="team"><span>${escapeHtml(matchAtCourt.team_b_name || '—')}</span></div>
                            </div>
                            ${matchAtCourt.round_number ? `<div class="round-badge">Vòng ${matchAtCourt.round_number} · Trận ${matchAtCourt.match_number || ''}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="court-card">
                    <div class="court-name"><span>${escapeHtml(venue.court_name || 'Sân ' + venue.court_number)}</span></div>
                    <div class="empty-court">Trống</div>
                </div>
            `;
        }).join('');
    }

    // ==========================================
    // XẾP LỊCH TỰ ĐỘNG - v4 FULL FIXED
    // ==========================================
    window.autoGenerateSchedule = async function() {
        if (draws.length === 0) { showAlert('Chưa có kết quả bốc thăm!', 'error'); return; }
        if (venues.length === 0) { showAlert('Chưa có sân!', 'error'); return; }
        if (!confirm('Tự động xếp lịch? Lịch cũ sẽ bị xóa!')) return;

        showAlert('⏳ Đang xếp lịch...', 'info');

        try {
            await supabaseClient.from('schedules').delete().eq('tournament_id', tournamentId);

            const startDate = new Date(tournament.start_date);
            const numDays = tournament.num_days || 5;
            const sessionsPerDay = tournament.sessions_per_day || 2;
            const matchDuration = tournament.match_duration || 45;
            const startTimes = {
                morning: tournament.start_time_morning || '08:00',
                afternoon: tournament.start_time_afternoon || '14:00',
                evening: tournament.start_time_evening || '19:00'
            };
            const sessionKeys = ['morning', 'afternoon', 'evening'].slice(0, sessionsPerDay);

            const allMatches = [];

            // Nhóm draws theo category
            const drawsByCategory = {};
            draws.forEach(d => {
                const cat = d.category || 'Chung';
                if (!drawsByCategory[cat]) drawsByCategory[cat] = [];
                drawsByCategory[cat].push(d);
            });

            console.log(`\n🎯 TỔNG NỘI DUNG: ${Object.keys(drawsByCategory).length}`);

            // ========================================
            // BƯỚC 1: TẠO TẤT CẢ CÁC TRẬN
            // ========================================
            Object.keys(drawsByCategory).forEach(catName => {
                const catDraws = drawsByCategory[catName];
                const cat = categories.find(c => c.name === catName);
                const isKnockout = catDraws[0]?.draw_type === 'knockout';

                console.log(`\n📌 Nội dung "${catName}": ${catDraws.length} VĐV | ${isKnockout ? 'Knockout' : 'Vòng tròn'}`);

                if (isKnockout) {
                    // ============ KNOCKOUT ============
                    // Nhóm theo group_name (A, B) để tách bracket
                    const groupDraws = {};
                    catDraws.forEach(d => {
                        const g = d.group_name || 'A';
                        if (!groupDraws[g]) groupDraws[g] = [];
                        groupDraws[g].push(d);
                    });

                    console.log(`  📊 Knockout có ${Object.keys(groupDraws).length} nhóm`);

                    // Với MỖI nhóm, tạo bracket riêng
                    Object.keys(groupDraws).forEach(groupName => {
                        if (groupName === 'BYE') return;

                        const groupTeams = groupDraws[groupName];
                        const totalTeams = groupTeams.length;

                        // Kiểm tra group đã có cặp đấu chưa (match_number)
                        const hasMatches = groupTeams.some(d => d.match_number != null);
                        let firstRoundMatches = [];

                        if (hasMatches) {
                            // Đã có cặp đấu → lấy từ match_number
                            const matchMap = new Map();
                            groupTeams.forEach(d => {
                                const key = d.match_number || 1;
                                if (!matchMap.has(key)) matchMap.set(key, []);
                                matchMap.get(key).push(d);
                            });
                            matchMap.forEach((teams, matchNum) => {
                                if (teams.length === 2) {
                                    firstRoundMatches.push({
                                        team_a: teams[0].team_name,
                                        team_b: teams[1].team_name
                                    });
                                } else if (teams.length === 1) {
                                    firstRoundMatches.push({ team_a: teams[0].team_name, team_b: 'BYE' });
                                }
                            });
                        } else {
                            // Chưa có cặp → tự tạo cặp
                            for (let i = 0; i < totalTeams; i += 2) {
                                if (groupTeams[i] && groupTeams[i + 1]) {
                                    firstRoundMatches.push({
                                        team_a: groupTeams[i].team_name,
                                        team_b: groupTeams[i + 1].team_name
                                    });
                                } else if (groupTeams[i]) {
                                    firstRoundMatches.push({ team_a: groupTeams[i].team_name, team_b: 'BYE' });
                                }
                            }
                        }

                        // Bracket size (lũy thừa 2 >= số VĐV)
                        let bracketSize = 2;
                        while (bracketSize < totalTeams) bracketSize *= 2;

                        console.log(`    Nhóm "${groupName}": ${totalTeams} VĐV → Bracket ${bracketSize}`);

                        // Tạo Vòng 1
                        firstRoundMatches.forEach((m, i) => {
                            allMatches.push({
                                team_a: m.team_a,
                                team_b: m.team_b,
                                round: 1,
                                match_num: i + 1,
                                category: `${catName} - Bảng ${groupName} - Vòng 1`,
                                cat_id: cat?.id
                            });
                        });

                        // Tạo các vòng tiếp theo
                        let currentRoundMatches = bracketSize / 2;
                        let roundNum = 2;

                        while (currentRoundMatches >= 1) {
                            let roundName = getRoundName(currentRoundMatches);

                            for (let i = 0; i < currentRoundMatches; i++) {
                                allMatches.push({
                                    team_a: `Chờ KQ ${roundName}`,
                                    team_b: `Chờ KQ ${roundName}`,
                                    round: roundNum,
                                    match_num: i + 1,
                                    category: `${catName} - Bảng ${groupName} - ${roundName}`,
                                    cat_id: cat?.id,
                                    is_placeholder: true
                                });
                            }

                            // Thêm trận tranh hạng 3 nếu là Bán kết
                            if (currentRoundMatches === 2) {
                                allMatches.push({
                                    team_a: `Thua BK 1`,
                                    team_b: `Thua BK 2`,
                                    round: roundNum,
                                    match_num: 99,
                                    category: `${catName} - Bảng ${groupName} - Tranh hạng 3`,
                                    cat_id: cat?.id,
                                    is_placeholder: true
                                });
                            }

                            currentRoundMatches = Math.floor(currentRoundMatches / 2);
                            roundNum++;
                            if (currentRoundMatches === 0) break;
                        }
                    });

                } else {
                    // ============ ROUND-ROBIN ============
                    const groups = {};
                    catDraws.forEach(d => {
                        const g = d.group_name || 'A';
                        if (!groups[g]) groups[g] = [];
                        groups[g].push(d);
                    });

                    const numGroups = Object.keys(groups).length;
                    console.log(`  📊 Vòng tròn: ${numGroups} bảng`);

                    // Vòng bảng
                    Object.keys(groups).forEach(groupName => {
                        const groupTeams = groups[groupName];
                        const n = groupTeams.length;
                        const numMatches = (n * (n - 1)) / 2;
                        console.log(`    Bảng ${groupName}: ${n} VĐV → ${numMatches} trận`);

                        for (let i = 0; i < n; i++) {
                            for (let j = i + 1; j < n; j++) {
                                allMatches.push({
                                    team_a: groupTeams[i].team_name,
                                    team_b: groupTeams[j].team_name,
                                    round: 1,
                                    match_num: allMatches.length + 1,
                                    category: `${catName} - Bảng ${groupName}`,
                                    cat_id: cat?.id
                                });
                            }
                        }
                    });

                    // Knockout sau vòng bảng
                    if (numGroups >= 2) {
                        let knockoutTeams = numGroups * 2;
                        let bracketSize = 2;
                        while (bracketSize < knockoutTeams) bracketSize *= 2;
                        if (bracketSize > 16) bracketSize = 16;

                        console.log(`  🏆 Knockout: ${bracketSize} đội`);

                        let currentRoundMatches = bracketSize / 2;
                        let roundNum = 2;

                        while (currentRoundMatches >= 1) {
                            let roundName = getRoundName(currentRoundMatches);

                            for (let i = 0; i < currentRoundMatches; i++) {
                                allMatches.push({
                                    team_a: `Nhất bảng ?`,
                                    team_b: `Nhì bảng ?`,
                                    round: roundNum,
                                    match_num: i + 1,
                                    category: `${catName} - ${roundName}`,
                                    cat_id: cat?.id,
                                    is_placeholder: true
                                });
                            }

                            if (currentRoundMatches === 2) {
                                allMatches.push({
                                    team_a: `Thua BK 1`,
                                    team_b: `Thua BK 2`,
                                    round: roundNum,
                                    match_num: 99,
                                    category: `${catName} - Tranh hạng 3`,
                                    cat_id: cat?.id,
                                    is_placeholder: true
                                });
                            }

                            currentRoundMatches = Math.floor(currentRoundMatches / 2);
                            roundNum++;
                            if (currentRoundMatches === 0) break;
                        }
                    }
                }
            });

            console.log(`\n✅ TỔNG SỐ TRẬN: ${allMatches.length}`);

            // ========================================
            // BƯỚC 2: TẠO SLOTS
            // ========================================
            const allSlots = [];
            for (let d = 0; d < numDays; d++) {
                const matchDate = new Date(startDate);
                matchDate.setDate(matchDate.getDate() + d);
                const dateStr = matchDate.toISOString().slice(0, 10);

                for (let s = 0; s < sessionsPerDay; s++) {
                    const sessionKey = sessionKeys[s];
                    for (let v = 0; v < venues.length; v++) {
                        allSlots.push({
                            date: dateStr,
                            session: sessionKey,
                            venue: venues[v],
                            startTime: startTimes[sessionKey],
                            endTime: addMinutes(startTimes[sessionKey], matchDuration)
                        });
                    }
                }
            }

            console.log(`📊 Tổng slot: ${allSlots.length} (${numDays} ngày × ${sessionsPerDay} buổi × ${venues.length} sân)`);

            if (allMatches.length > allSlots.length) {
                console.warn(`⚠️ CẦN THÊM ${allMatches.length - allSlots.length} SLOT!`);
                showAlert(`⚠️ Cần ${allMatches.length} trận nhưng chỉ có ${allSlots.length} slot. Hãy tăng số ngày/sân!`, 'error');
            }

            // ========================================
            // BƯỚC 3: XẾP LỊCH - CHECK TRÙNG VĐV
            // ========================================
            allMatches.sort((a, b) => (a.round || 1) - (b.round || 1));

            const busyAthletes = {};  // "date|session" → Set tên VĐV
            const busySlots = {};      // "date|session|venueId" → true
            const records = [];
            let placed = 0, skipped = 0;
            let slotIdx = 0;

            for (const match of allMatches) {
                let isPlaced = false;

                for (let attempt = 0; attempt < allSlots.length; attempt++) {
                    const sIdx = (slotIdx + attempt) % allSlots.length;
                    const slot = allSlots[sIdx];
                    const slotFullKey = `${slot.date}|${slot.session}|${slot.venue.id}`;

                    if (busySlots[slotFullKey]) continue;

                    const slotKey = `${slot.date}|${slot.session}`;
                    if (!busyAthletes[slotKey]) busyAthletes[slotKey] = new Set();

                    const athleteA = match.team_a;
                    const athleteB = match.team_b;
                    const isPlaceholder = match.is_placeholder ||
                                          (athleteA && (athleteA.includes('Chờ') || athleteA.includes('Nhất') || athleteA.includes('Nhì') || athleteA.includes('Thua')));

                    if (!isPlaceholder) {
                        if (busyAthletes[slotKey].has(athleteA) || busyAthletes[slotKey].has(athleteB)) {
                            continue;
                        }
                    }

                    busySlots[slotFullKey] = true;
                    if (!isPlaceholder) {
                        busyAthletes[slotKey].add(athleteA);
                        busyAthletes[slotKey].add(athleteB);
                    }

                    records.push({
                        tournament_id: tournamentId,
                        category_id: match.cat_id || null,
                        venue_id: slot.venue.id,
                        match_date: slot.date,
                        session: slot.session,
                        start_time: slot.startTime,
                        end_time: slot.endTime,
                        round_number: match.round || 1,
                        match_number: match.match_num,
                        team_a_name: match.team_a,
                        team_b_name: match.team_b,
                        status: 'scheduled',
                        notes: match.category || null
                    });

                    slotIdx = (sIdx + 1) % allSlots.length;
                    placed++;
                    isPlaced = true;
                    break;
                }

                if (!isPlaced) skipped++;
            }

            console.log(`📋 ĐÃ XẾP: ${placed} trận | ⚠️ BỎ QUA: ${skipped} trận`);

            if (records.length === 0) { showAlert('Không có trận nào để xếp!', 'error'); return; }

            // Insert theo batch
            const BATCH_SIZE = 100;
            for (let i = 0; i < records.length; i += BATCH_SIZE) {
                const batch = records.slice(i, i + BATCH_SIZE);
                const { error } = await supabaseClient.from('schedules').insert(batch);
                if (error) throw error;
            }

            showAlert(`✅ Đã xếp ${records.length} trận!${skipped > 0 ? ` (Bỏ qua ${skipped} do thiếu slot)` : ''}`, 'success');
            await loadData();

        } catch (error) {
            console.error('❌', error);
            showAlert('Lỗi: ' + error.message, 'error');
        }
    };

    // Helper: tên vòng đấu
    function getRoundName(matches) {
        if (matches === 1) return 'Chung kết';
        if (matches === 2) return 'Bán kết';
        if (matches === 4) return 'Tứ kết';
        if (matches === 8) return 'Vòng 1/8';
        if (matches === 16) return 'Vòng 1/16';
        if (matches === 32) return 'Vòng 1/32';
        if (matches === 64) return 'Vòng 1/64';
        return `Vòng ${matches * 2}`;
    }

    // ==========================================
    // EXPORT EXCEL
    // ==========================================
    window.exportScheduleExcel = function() {
        if (schedules.length === 0) { showAlert('Chưa có lịch!', 'error'); return; }

        const data = schedules.map((s, i) => {
            const venue = venues.find(v => v.id === s.venue_id);
            return {
                'STT': i + 1,
                'Ngày': formatDate(s.match_date),
                'Buổi': getSessionLabel(s.session),
                'Giờ': formatTime(s.start_time),
                'Sân': venue?.court_name || '',
                'Nội dung': s.notes || '',
                'Vòng': s.round_number || '',
                'Trận': s.match_number || '',
                'VĐV A': s.team_a_name || '',
                'VĐV B': s.team_b_name || '',
                'Trạng thái': getStatusLabel(s.status)
            };
        });

        const ws = XLSX.utils.json_to_sheet(data);
        ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 12 }, { wch: 30 }, { wch: 6 }, { wch: 6 }, { wch: 25 }, { wch: 25 }, { wch: 15 }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Lịch thi đấu');
        XLSX.writeFile(wb, `LichThiDau_${new Date().toISOString().slice(0, 10)}.xlsx`);
        showAlert('✅ Đã xuất file!', 'success');
    };

    // HELPERS
    function getSessions() {
        const sessionsPerDay = tournament?.sessions_per_day || 2;
        const all = [
            { key: 'morning', label: 'Buổi Sáng', icon: 'sun', time: tournament?.start_time_morning || '08:00' },
            { key: 'afternoon', label: 'Buổi Chiều', icon: 'cloud-sun', time: tournament?.start_time_afternoon || '14:00' },
            { key: 'evening', label: 'Buổi Tối', icon: 'moon', time: tournament?.start_time_evening || '19:00' }
        ];
        return all.slice(0, sessionsPerDay);
    }

    function getSessionLabel(session) {
        return { morning: 'Sáng', afternoon: 'Chiều', evening: 'Tối' }[session] || session;
    }

    function getStatusLabel(status) {
        return { scheduled: 'Chưa diễn ra', ongoing: 'Đang diễn ra', completed: 'Đã kết thúc', cancelled: 'Đã hủy' }[status] || 'Chưa diễn ra';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        return timeStr.slice(0, 5);
    }

    function addMinutes(time, mins) {
        const [h, m] = time.split(':').map(Number);
        const total = h * 60 + m + mins;
        const newH = Math.floor(total / 60) % 24;
        const newM = total % 60;
        return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    }

    function showAlert(message, type) {
        const el = document.getElementById('alert');
        el.textContent = message;
        el.className = 'alert show ' + type;
        if (type !== 'info') setTimeout(() => { el.className = 'alert'; }, 6000);
    }

    function showError(message) {
        document.getElementById('loading').innerHTML = `
            <i class="fas fa-exclamation-triangle" style="color: #e94560;"></i>
            <p style="color: #e94560; font-weight: 700;">${message}</p>
        `;
    }

    function escapeHtml(text) {
        return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
})();
</script>
