<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập Admin - SportsVN</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #062d73, #0866d8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #0866d8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      margin: 0 auto 18px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #14213d;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8dfe8;
      border-radius: 9px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #0866d8;
      box-shadow: 0 0 0 3px rgba(8,102,216,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #0866d8;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0757b8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #0866d8;
      text-decoration: none;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      width: 100%;
      max-width: 1000px;
      margin: 30px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .dashboard h2 {
      margin-top: 0;
      color: #14213d;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 25px;
    }

    .admin-card {
      padding: 25px;
      border: 1px solid #e3e8ef;
      border-radius: 12px;
      font-weight: 700;
      color: #14213d;
      background: #f8fafc;
    }

    .logout {
      width: auto;
      padding: 10px 20px;
      margin-top: 25px;
      background: #dc3545;
    }

    .logout:hover {
      background: #bb2d3b;
    }

    @media (max-width: 700px) {
      .login-box {
        margin: 20px;
        padding: 30px 22px;
      }

      .admin-grid {
        grid-template-columns: 1fr;
      }

      .dashboard {
        margin: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- ĐĂNG NHẬP -->
  <div class="login-box" id="loginBox">

    <div class="logo">SV</div>

    <h1>SportsVN Admin</h1>

    <div class="subtitle">
      Hệ thống quản trị Cổng thông tin thể thao Việt Nam
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Nhập email quản trị"
        required
      >

      <label for="password">Mật khẩu</label>

      <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu"
        required
      >

      <button type="submit" id="loginButton">
        ĐĂNG NHẬP
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Quay lại SportsVN
    </a>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <h2>SportsVN — Trang quản trị</h2>

    <p>
      Xin chào Admin. Anh đã đăng nhập thành công.
    </p>

    <div class="admin-grid">

      <div class="admin-card">
        📰 Tin thể thao
      </div>

      <div class="admin-card">
        🏆 Giải đấu
      </div>

      <div class="admin-card">
        👤 Vận động viên
      </div>

      <div class="admin-card">
        🏟️ Đơn vị / CLB
      </div>

      <div class="admin-card">
        📅 Lịch thi đấu
      </div>

      <div class="admin-card">
        🥇 Kết quả
      </div>

      <div class="admin-card">
        🎲 Bốc thăm
      </div>

    </div>

    <button class="logout" id="logoutButton">
      Đăng xuất
    </button>

  </div>


<script>

const SUPABASE_URL =
  "https://bqziksmsdtnodcfykgqk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PyxvVa3K8LgTRyGCXeNLwA_HUoRPgli";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const loginForm = document.getElementById("loginForm");
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");


function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#198754" : "#dc3545";
}


/* KIỂM TRA TÀI KHOẢN ĐÃ ĐĂNG NHẬP */
async function checkSession() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    return;
  }

  await checkAdmin(session.user);
}


/* KIỂM TRA QUYỀN ADMIN */
async function checkAdmin(user) {

  const { data, error } =
    await supabaseClient.rpc("is_admin");

  if (error) {

    console.error(error);

    await supabaseClient.auth.signOut();

    showMessage(
      "Không thể kiểm tra quyền quản trị."
    );

    return;
  }


  if (!data) {

    await supabaseClient.auth.signOut();

    showMessage(
      "Tài khoản này không có quyền Admin."
    );

    return;
  }


  loginBox.style.display = "none";
  dashboard.style.display = "block";
}


/* ĐĂNG NHẬP */
loginForm.addEventListener("submit", async function(e) {

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  loginButton.disabled = true;

  loginButton.textContent = "ĐANG ĐĂNG NHẬP...";

  showMessage("");


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    showMessage(
      "Email hoặc mật khẩu không chính xác."
    );

    loginButton.disabled = false;

    loginButton.textContent = "ĐĂNG NHẬP";

    return;
  }


  await checkAdmin(data.user);


  loginButton.disabled = false;

  loginButton.textContent = "ĐĂNG NHẬP";

});


/* ĐĂNG XUẤT */
logoutButton.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  dashboard.style.display = "none";
  loginBox.style.display = "block";

  loginForm.reset();

  showMessage(
    "Đã đăng xuất thành công.",
    true
  );

});


/* KIỂM TRA SESSION KHI MỞ TRANG */
checkSession();

</script>

</body>
</html>
