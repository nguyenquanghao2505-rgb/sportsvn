<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Test Modules</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #f5f7fa; }
    h1 { color: #0f172a; }
    .result {
      background: white; padding: 16px; border-radius: 8px;
      margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08);
      line-height: 1.6;
    }
    .ok { color: #16a34a; font-weight: 600; }
    .fail { color: #dc2626; font-weight: 600; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>🧪 Test Modules — Giai đoạn 5</h1>
  <div id="output"></div>

  <script type="module">
    const out = document.getElementById('output');

    function log(msg, cls = '') {
      const div = document.createElement('div');
      div.className = 'result';
      div.innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg;
      out.appendChild(div);
    }

    async function testFile(name, path, expectedFuncs) {
      try {
        const mod = await import(path);
        const funcs = Object.keys(mod);
        const missing = expectedFuncs.filter(f => !funcs.includes(f));
        if (missing.length === 0) {
          log(`✅ <b>${name}</b> — load OK, có ${funcs.length} hàm`, 'ok');
        } else {
          log(`⚠️ <b>${name}</b> — thiếu hàm: ${missing.join(', ')}`, 'fail');
        }
        return mod;
      } catch (err) {
        log(`❌ <b>${name}</b> — LỖI: ${err.message}`, 'fail');
        return null;
      }
    }

    log('<b>📦 Test 1: Load 3 file module</b>');

    const tm = await testFile('tournament-members.js', './tournament-members.js',
      ['TOURNAMENT_ROLES', 'addMember', 'canInTournament']);
    const t = await testFile('tournaments.js', './tournaments.js',
      ['createTournament', 'listTournaments', 'deleteTournament']);
    const a = await testFile('articles.js', './articles.js',
      ['createArticle', 'listArticles', 'deleteArticle']);

    if (tm && t && a) {
      log('<b>🎬 Test 2: Tạo giải đấu + bài viết</b>');

      const { seedDemoUsers, login } = await import('./auth.js');
      const { seedTournaments } = await import('./tournaments.js');
      const { seedMembers } = await import('./tournament-members.js');
      const { seedArticles } = await import('./articles.js');

      seedDemoUsers();
      seedTournaments();
      seedMembers();
      seedArticles();

      const session = login('nhanvien', '123');
      log(`👤 Đăng nhập: <b>${session.username}</b> (<code>${session.id}</code>)`);

      const tour = t.createTournament({ name: 'Giải Test Giai đoạn 5' });
      log(`🎉 Tạo giải: <b>${tour.name}</b><br>ID: <code>${tour.id}</code><br>Creator: <code>${tour.creator_id}</code>`);

      const members = JSON.parse(localStorage.getItem('tournament_members_v2') || '[]');
      const owner = members.find(m => m.tournament_id === tour.id);
      if (owner && owner.user_id === session.id && owner.role === 'owner') {
        log(`👑 OWNER gán đúng: user_id=<code>${owner.user_id}</code>, role=<code>${owner.role}</code>`, 'ok');
      } else {
        log(`❌ OWNER gán SAI: ${JSON.stringify(owner)}`, 'fail');
      }

      const art = a.createArticle({ title: 'Bài test GĐ5', content: '...', type: 'article' });
      log(`📝 Tạo bài viết: <b>${art.title}</b><br>ID: <code>${art.id}</code>`);

      log('<b>✅ TẤT CẢ TEST ĐÃ PASS — Giai đoạn 5 hoàn thành!</b>', 'ok');
    }
  </script>
</body>
</html>
