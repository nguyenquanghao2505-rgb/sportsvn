<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[TÊN TRANG] - SportsVN</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sidebar.js" defer></script>
    <style>
        /* CSS riêng cho trang này */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .placeholder-content {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            border: 2px dashed var(--border);
            color: var(--text-muted);
        }
        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .placeholder-content h2 {
            color: var(--text-dark);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar tự động render -->
        
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu" id="mobileMenu">☰</button>
                    <div class="topbar-brand">
                        <span class="topbar-label">SPORTS MANAGEMENT PLATFORM</span>
                        <h1 class="topbar-title-main">SPORTS<span>VN</span></h1>
                        <p class="topbar-subtitle">[MÔ TẢ NGẮN]</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <a href="index.html" class="topbar-cta" style="background: #f3f4f6; color: #4b5563; box-shadow: none;">
                        ← Về trang chủ
                    </a>
                </div>
            </header>

            <section class="content">
                <div class="page-header">
                    <h1>[ICON] [TÊN TRANG]</h1>
                    <p>[MÔ TẢ]</p>
                </div>

                <div class="placeholder-content">
                    <div class="placeholder-icon">[ICON]</div>
                    <h2>Tính năng đang được phát triển</h2>
                    <p>Trang này sẽ sớm được cập nhật đầy đủ.</p>
                </div>
            </section>

            <footer class="footer">
                <span>© 2026 SportsVN</span>
                <span>Nền tảng công nghệ thể thao Việt Nam</span>
            </footer>
        </main>
    </div>
</body>
</html>
