<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportsVN — Trung tâm điều hành</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">SV</div><h1>SportsVN Admin</h1>
    <p>Trung tâm quản lý giải đấu, VĐV, lịch sân và truyền thông.</p>
    <form id="loginForm">
      <label>Email quản trị / tài khoản</label><input id="email" type="email" value="nguyenquanghao2505@gmail.com" required>
      <label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="primary wide" id="loginButton">ĐĂNG NHẬP</button>
      <a class="forgot" href="#" id="forgot">Quên mật khẩu?</a>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="app" class="app-shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><div class="side-logo">SV</div><div><b>SPORTS<span>VN</span></b><small>Nền tảng quản lý thể thao</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">⌂ <span>Tổng quan</span></button>
      <div class="nav-label">QUẢN LÝ GIẢI ĐẤU</div>
      <button class="nav-item" data-view="tournaments">🏆 <span>Giải đấu của tôi</span></button>
      <button class="nav-item" data-view="create">＋ <span>Tạo giải đấu mới</span></button>
      <button class="nav-item" data-view="registrations">☑ <span>Đăng ký & nhận hồ sơ</span></button>
      <div class="nav-label">THI ĐẤU</div>
      <button class="nav-item" data-view="draw">🎲 <span>Bốc thăm thông minh</span></button>
      <button class="nav-item" data-view="schedule">▦ <span>Lịch thi đấu</span></button>
      <button class="nav-item" data-view="venues">⌂ <span>Đặt sân / địa điểm</span></button>
      <button class="nav-item" data-view="results">📊 <span>Nhập kết quả</span></button>
      <button class="nav-item" data-view="ranking">↗ <span>Bảng xếp hạng</span></button>
      <div class="nav-label">VẬN ĐỘNG VIÊN</div>
      <button class="nav-item" data-view="athletes">♙ <span>Hồ sơ vận động viên</span></button>
      <button class="nav-item" data-view="units">♧ <span>Đơn vị / Câu lạc bộ</span></button>
      <button class="nav-item" data-view="medals">🏅 <span>Huy chương - Thành tích</span></button>
      <div class="nav-label">NỘI DUNG & AI</div>
      <button class="nav-item" data-view="news">📰 <span>Tin tức thể thao</span></button>
      <button class="nav-item" data-view="media">▧ <span>Thư viện ảnh / video</span></button>
      <button class="nav-item" data-view="ai">✦ <span>AI SportsVN</span></button>
      <div class="nav-label">HỆ THỐNG</div>
      <button class="nav-item" data-view="accounts">♙ <span>Tài khoản & phân quyền</span></button>
      <button class="nav-item" data-view="payments">₫ <span>Thanh toán</span></button>
      <button class="nav-item" data-view="settings">⚙ <span>Cài đặt</span></button>
    </nav>
    <div class="side-contact"><b>SPORTSVN</b><small>0905771177 · Zalo 0905771177 / 0384913999</small></div>
  </aside>

  <main class="main">
    <header class="topbar"><button class="hamb" id="hamb">☰</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Tìm kiếm giải đấu, VĐV, đơn vị, trận đấu..."/></div><div class="top-actions"><span class="bell">◔<i>12</i></span><span>🇻🇳</span><div class="user"><span class="avatar">A</span><div><b id="userName">BTC Admin</b><small id="userRole">Quản trị viên</small></div>⌄</div></div></header>
    <div id="content" class="content"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body></html>
