<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SportsVN - Nền tảng thể thao Việt Nam. Tin tức, giải đấu, lịch thi đấu, kết quả và vận động viên."
  >

  <title>SportsVN - Nền tảng thể thao Việt Nam</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css?v=20260822">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cấu hình Supabase -->
  <script src="./config.js?v=20260822"></script>
</head>

<body>

  <!-- APP -->
  <div id="app"></div>

  <!-- MODAL ĐĂNG NHẬP / ĐĂNG KÝ -->
  <div
    id="auth-modal"
    class="modal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-auth
    ></div>

    <section
      class="auth-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-title"
    >

      <button
        type="button"
        class="modal-close"
        data-close-auth
        aria-label="Đóng"
      >
        ×
      </button>

      <div class="auth-brand">
        <span>SV</span>

        <div>
          <strong>SportsVN</strong>
          <small>Nền tảng thể thao Việt Nam</small>
        </div>
      </div>

      <!-- TAB -->
      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
          id="login-tab"
        >
          Đăng nhập
        </button>

        <button
          type="button"
          class="auth-tab"
          id="register-tab"
        >
          Đăng ký
        </button>

      </div>

      <!-- ĐĂNG NHẬP -->
      <form
        id="login-form"
        class="auth-form"
      >

        <h2 id="auth-title">
          Đăng nhập
        </h2>

        <p>
          Đăng nhập để quản lý giải đấu và tài khoản SportsVN.
        </p>

        <label>
          Email

          <input
            type="email"
            id="login-email"
            placeholder="Nhập email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Mật khẩu

          <input
            type="password"
            id="login-password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          >
        </label>

        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          ĐĂNG NHẬP
        </button>

        <div
          id="login-message"
          class="form-message"
        ></div>

      </form>

      <!-- ĐĂNG KÝ -->
      <form
        id="register-form"
        class="auth-form hidden"
      >

        <h2>
          Tạo tài khoản
        </h2>

        <p>
          Tạo tài khoản để bắt đầu quản lý giải đấu.
        </p>

        <label>
          Họ và tên

          <input
            type="text"
            id="register-name"
            placeholder="Nguyễn Văn A"
            autocomplete="name"
            required
          >
        </label>

        <label>
          Email

          <input
            type="email"
            id="register-email"
            placeholder="example@gmail.com"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Mật khẩu

          <input
            type="password"
            id="register-password"
            placeholder="Tối thiểu 6 ký tự"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </label>

        <label>
          Nhập lại mật khẩu

          <input
            type="password"
            id="register-password-confirm"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </label>

        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          TẠO TÀI KHOẢN
        </button>

        <div
          id="register-message"
          class="form-message"
        ></div>

      </form>

    </section>
  </div>

  <!-- APP JS -->
  <script
    src="./app.js?v=20260822"
    defer
  ></script>

</body>
</html>
