<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SportsVN - Nền tảng thể thao Việt Nam"
  >

  <title>SportsVN - Nền tảng thể thao Việt Nam</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./styles.css?v=20260823"
  >

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- Cấu hình -->
  <script
    src="./config.js?v=20260823"
  ></script>
</head>

<body>

  <!-- ==================================================
       ỨNG DỤNG
       ================================================== -->

  <div id="app">

    <!-- Nội dung dự phòng.
         Nếu app.js chưa tải được thì máy tính
         vẫn không bị trắng hoàn toàn. -->

    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:30px;
        font-family:Arial,sans-serif;
        text-align:center;
      "
    >

      <div>

        <div
          style="
            width:60px;
            height:60px;
            margin:0 auto 18px;
            border-radius:16px;
            background:#0869df;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:900;
          "
        >
          SV
        </div>

        <h1
          style="
            margin:0 0 10px;
            color:#0d2b58;
          "
        >
          SPORTSVN
        </h1>

        <p
          style="
            margin:0;
            color:#667085;
          "
        >
          Đang tải nền tảng thể thao Việt Nam...
        </p>

      </div>

    </div>

  </div>


  <!-- ==================================================
       MODAL ĐĂNG NHẬP / ĐĂNG KÝ
       ================================================== -->

  <div
    id="auth-modal"
    class="modal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-auth
    ></div>


    <section
      class="auth-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-title"
    >

      <!-- Nút đóng -->

      <button
        type="button"
        class="modal-close"
        data-close-auth
        aria-label="Đóng"
      >
        ×
      </button>


      <!-- Logo -->

      <div class="auth-brand">

        <span>
          SV
        </span>

        <div>

          <strong>
            SportsVN
          </strong>

          <small>
            Nền tảng thể thao Việt Nam
          </small>

        </div>

      </div>


      <!-- ==================================================
           TAB ĐĂNG NHẬP / ĐĂNG KÝ
           ================================================== -->

      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
          id="login-tab"
        >
          Đăng nhập
        </button>

        <button
          type="button"
          class="auth-tab"
          id="register-tab"
        >
          Đăng ký
        </button>

      </div>


      <!-- ==================================================
           FORM ĐĂNG NHẬP
           ================================================== -->

      <form
        id="login-form"
        class="auth-form"
      >

        <h2 id="auth-title">
          Đăng nhập
        </h2>

        <p>
          Đăng nhập để quản lý giải đấu
          và tài khoản SportsVN.
        </p>


        <label>

          Email

          <input
            type="email"
            id="login-email"
            placeholder="Nhập email"
            autocomplete="email"
            required
          >

        </label>


        <label>

          Mật khẩu

          <input
            type="password"
            id="login-password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          >

        </label>


        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          ĐĂNG NHẬP
        </button>


        <div
          id="login-message"
          class="form-message"
          aria-live="polite"
        ></div>

      </form>


      <!-- ==================================================
           FORM ĐĂNG KÝ
           ================================================== -->

      <form
        id="register-form"
        class="auth-form hidden"
      >

        <h2>
          Tạo tài khoản
        </h2>

        <p>
          Tạo tài khoản để bắt đầu
          quản lý giải đấu.
        </p>


        <label>

          Họ và tên

          <input
            type="text"
            id="register-name"
            placeholder="Nguyễn Văn A"
            autocomplete="name"
            required
          >

        </label>


        <label>

          Email

          <input
            type="email"
            id="register-email"
            placeholder="example@gmail.com"
            autocomplete="email"
            required
          >

        </label>


        <label>

          Mật khẩu

          <input
            type="password"
            id="register-password"
            placeholder="Tối thiểu 6 ký tự"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </label>


        <label>

          Nhập lại mật khẩu

          <input
            type="password"
            id="register-password-confirm"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </label>


        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          TẠO TÀI KHOẢN
        </button>


        <div
          id="register-message"
          class="form-message"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </div>


  <!-- ==================================================
       APP JAVASCRIPT
       ================================================== -->

  <script
    src="./app.js?v=20260823"
    defer
  ></script>


  <!-- ==================================================
       FALLBACK KIỂM TRA APP.JS
       ================================================== -->

  <script>

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {

            const app =
              document.getElementById("app");

            /*
             * Nếu app.js không chạy hoặc lỗi,
             * hiện thông báo thay vì để trang trắng.
             */

            if (
              app &&
              app.children.length === 1 &&
              app.querySelector("h1") &&
              app.querySelector("h1").textContent
                .includes("SPORTSVN")
            ) {

              console.warn(
                "SportsVN: app.js chưa chạy."
              );

              const box =
                document.createElement("div");

              box.style.position = "fixed";
              box.style.left = "50%";
              box.style.bottom = "20px";
              box.style.transform =
                "translateX(-50%)";

              box.style.background =
                "#fff3cd";

              box.style.color =
                "#664d03";

              box.style.padding =
                "12px 18px";

              box.style.border =
                "1px solid #ffecb5";

              box.style.borderRadius =
                "10px";

              box.style.fontFamily =
                "Arial,sans-serif";

              box.style.fontSize =
                "13px";

              box.style.zIndex =
                "9999";

              box.textContent =
                "SportsVN chưa tải được app.js. Hãy kiểm tra file app.js.";

              document.body.appendChild(box);

            }

          },
          1500
        );

      }
    );

  </script>

</body>
</html>
