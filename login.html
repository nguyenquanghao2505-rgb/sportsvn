<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - SportsVN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a1628, #1a3a7a); padding: 20px; }
        .login-container { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .login-container .logo { text-align: center; margin-bottom: 32px; }
        .login-container .logo h1 { font-size: 32px; font-weight: 800; color: #0a1628; }
        .login-container .logo h1 span { color: #e94560; }
        .login-container .logo p { color: #6c757d; font-size: 14px; margin-top: 4px; }
        .login-container .form-group { margin-bottom: 20px; }
        .login-container .form-group label { display: block; font-weight: 600; font-size: 14px; color: #1a1a2e; margin-bottom: 6px; }
        .login-container .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: 12px; font-size: 15px; transition: all 0.3s ease; background: #f8f9fa; }
        .login-container .form-group input:focus { border-color: #1a3a7a; outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(26, 58, 122, 0.1); }
        .login-container .form-group .input-group { position: relative; }
        .login-container .form-group .input-group input { padding-right: 48px; }
        .login-container .form-group .input-group .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6c757d; cursor: pointer; font-size: 18px; }
        .login-container .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px; }
        .login-container .form-options label { display: flex; align-items: center; gap: 8px; color: #6c757d; cursor: pointer; }
        .login-container .form-options a { color: #1a3a7a; text-decoration: none; font-weight: 600; }
        .login-container .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #0a1628, #1a3a7a); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .login-container .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26, 58, 122, 0.4); }
        .login-container .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .login-container .btn-login .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .login-container .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
        .login-container .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .login-container .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        @media (max-width: 480px) { .login-container { padding: 32px 24px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Sports<span>VN</span></h1>
            <p>Nền tảng quản lý giải thể thao</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn" required autofocus>
            </div>

            <div class="form-group">
                <label>🔑 Mật khẩu</label>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label><input type="checkbox" id="remember"> Ghi nhớ</label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Đăng nhập</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        (function() {
            'use strict';
            
            const config = window.SPORTSVN_CONFIG || {};
            if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
                console.error('❌ Chưa cấu hình Supabase trong config.js');
                return;
            }

            const supabaseClient = window.supabase.createClient(
                config.SUPABASE_URL,
                config.SUPABASE_ANON_KEY
            );

            async function checkAdminRole(userId) {
                try {
                    const { data, error } = await supabaseClient
                        .from('user_roles')
                        .select('role')
                        .eq('user_id', userId)
                        .single();
                    if (error || !data) return false;
                    return data.role === 'admin';
                } catch (err) {
                    console.error('Lỗi kiểm tra role:', err);
                    return false;
                }
            }

            window.handleLogin = async function(event) {
                event.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const alertEl = document.getElementById('alert');
                const btn = document.getElementById('loginBtn');
                const btnText = document.getElementById('btnText');
                const btnSpinner = document.getElementById('btnSpinner');

                alertEl.className = 'alert';
                alertEl.style.display = 'none';

                if (!email || !password) {
                    showAlert('Vui lòng nhập đầy đủ email và mật khẩu.', 'error');
                    return;
                }

                btn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'block';

                try {
                    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (authError) {
                        showAlert('❌ Lỗi: ' + authError.message, 'error');
                        btn.disabled = false;
                        btnText.style.display = 'block';
                        btnSpinner.style.display = 'none';
                        return;
                    }

                    const isAdmin = await checkAdminRole(authData.user.id);

                    if (!isAdmin) {
                        await supabaseClient.auth.signOut();
                        showAlert('⛔ Tài khoản không có quyền Admin.', 'error');
                        btn.disabled = false;
                        btnText.style.display = 'block';
                        btnSpinner.style.display = 'none';
                        return;
                    }

                    localStorage.setItem('sportsvn_admin', JSON.stringify({
                        user: authData.user,
                        isAdmin: true
                    }));

                    showAlert('✅ Đăng nhập thành công! Đang chuyển hướng...', 'success');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);

                } catch (error) {
                    showAlert('❌ Có lỗi xảy ra: ' + error.message, 'error');
                    btn.disabled = false;
                    btnText.style.display = 'block';
                    btnSpinner.style.display = 'none';
                }
            };

            function showAlert(message, type) {
                const alertEl = document.getElementById('alert');
                alertEl.textContent = message;
                alertEl.className = 'alert ' + type;
                alertEl.style.display = 'block';
            }

            window.togglePassword = function() {
                const password = document.getElementById('password');
                const icon = document.getElementById('toggleIcon');
                if (password.type === 'password') {
                    password.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    password.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            };
        })();
    </script>
</body>
</html>
