<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý giải đấu - SportsVN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f2f8; min-height: 100vh; padding: 24px; }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0d1b3e, #1a3a7a);
            border-radius: 20px;
            padding: 32px;
            color: #fff;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.85; }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233,69,96,0.4); }

        .btn-outline { background: transparent; color: #fff; border: 2px solid #fff; }
        .btn-outline:hover { background: #fff; color: #0d1b3e; }

        .panel {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .panel-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-content {
            background: #fff;
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            background: linear-gradient(135deg, #0d1b3e, #1a3a7a);
            color: #fff;
            padding: 24px 28px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-header h2 { font-size: 20px; }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
        }

        .modal-body { padding: 28px; }

        .section-label {
            font-size: 13px;
            font-weight: 800;
            color: #1a3a7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label i { font-size: 16px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 24px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        .form-group label span { color: #e94560; }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1a3a7a;
            outline: none;
        }

        .form-group textarea { resize: vertical; min-height: 80px; }

        .form-hint {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show { display: block; }
        .alert.error { background: #f8d7da; color: #721c24; }
        .alert.success { background: #d4edda; color: #155724; }

        /* TOURNAMENT CARD */
        .tournament-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .tournament-card {
            background: #fff;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 5px solid #1a3a7a;
            transition: all 0.3s ease;
        }

        .tournament-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .tournament-card h3 {
            font-size: 17px;
            color: #1a1a2e;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .tournament-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 14px;
        }

        .tournament-meta span { display: flex; align-items: center; gap: 8px; }

        .tournament-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item { text-align: center; }
        .stat-item .value { font-size: 20px; font-weight: 800; color: #1a3a7a; display: block; }
        .stat-item .label { font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.draft { background: #e9ecef; color: #6c757d; }
        .badge.registration { background: #cfe2ff; color: #084298; }
        .badge.ongoing { background: #d4edda; color: #155724; }
        .badge.completed { background: #f8d7da; color: #721c24; }
        .badge.cancelled { background: #e2e3e5; color: #41464b; }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e9ecef;
        }

        .btn-small {
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-small:hover { transform: translateY(-1px); }

        .btn-draw { background: #00b894; color: #fff; }
        .btn-categories { background: #6c5ce7; color: #fff; }
        .btn-schedule { background: #fdcb6e; color: #1a1a2e; }
        .btn-edit { background: #fdcb6e; color: #1a1a2e; }
        .btn-delete { background: #e94560; color: #fff; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state i { font-size: 60px; color: #dee2e6; margin-bottom: 16px; display: block; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .time-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div>
            <h1>🏆 Quản lý giải đấu</h1>
            <p>Danh sách tất cả giải đấu của bạn · SportsVN</p>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="index.html" class="btn btn-outline">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <button class="btn btn-primary" onclick="openCreateModal()">
                <i class="fas fa-plus"></i> Tạo giải đấu
            </button>
        </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="panel">
        <div class="panel-title">📋 Danh sách giải đấu (<span id="count">0</span>)</div>
        <div id="tournament-list" class="tournament-grid">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang tải...</p>
            </div>
        </div>
    </div>

</div>

<!-- MODAL TẠO/SỬA GIẢI ĐẤU -->
<div class="modal-overlay" id="tournament-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Tạo giải đấu mới</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <form id="tournament-form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="tournament-id">

                <!-- THÔNG TIN CƠ BẢN -->
                <div class="section-label"><i class="fas fa-info-circle"></i> Thông tin cơ bản</div>
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Tên giải đấu <span>*</span></label>
                        <input type="text" id="name" required placeholder="VD: Giải Cầu lông Đà Nẵng 2026">
                    </div>

                    <div class="form-group">
                        <label>Môn thể thao <span>*</span></label>
                        <select id="sport" required>
                            <option value="">-- Chọn môn --</option>
                            <option>Bóng đá</option>
                            <option>Bóng rổ</option>
                            <option>Bóng chuyền</option>
                            <option>Cầu lông</option>
                            <option>Pickleball</option>
                            <option>Tennis</option>
                            <option>Bóng bàn</option>
                            <option>Taekwondo</option>
                            <option>Bơi</option>
                            <option>Cờ tướng</option>
                            <option>Đua thuyền</option>
                            <option>Võ thuật khác</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Trạng thái</label>
                        <select id="status">
                            <option value="draft">Bản nháp</option>
                            <option value="registration" selected>Đăng ký</option>
                            <option value="ongoing">Đang diễn ra</option>
                            <option value="completed">Đã kết thúc</option>
                            <option value="cancelled">Đã hủy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ngày bắt đầu <span>*</span></label>
                        <input type="date" id="start_date" required>
                    </div>

                    <div class="form-group">
                        <label>Ngày kết thúc</label>
                        <input type="date" id="end_date">
                    </div>

                    <div class="form-group full">
                        <label>Địa điểm <span>*</span></label>
                        <input type="text" id="location" required placeholder="VD: Nhà thi đấu Tiên Sơn, Đà Nẵng">
                    </div>
                </div>

                <!-- CẤU HÌNH THI ĐẤU -->
                <div class="section-label"><i class="fas fa-cog"></i> Cấu hình thi đấu</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Số sân <span>*</span></label>
                        <input type="number" id="num_venues" min="1" max="15" value="4" required>
                        <div class="form-hint">Từ 1 đến 15 sân</div>
                    </div>

                    <div class="form-group">
                        <label>Số ngày thi đấu <span>*</span></label>
                        <input type="number" id="num_days" min="1" max="30" value="3" required>
                        <div class="form-hint">Số ngày tổ chức giải</div>
                    </div>

                    <div class="form-group">
                        <label>Số buổi/ngày <span>*</span></label>
                        <select id="sessions_per_day" required>
                            <option value="1">1 buổi (Sáng)</option>
                            <option value="2" selected>2 buổi (Sáng + Chiều)</option>
                            <option value="3">3 buổi (Sáng + Chiều + Tối)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Thời lượng 1 trận (phút) <span>*</span></label>
                        <input type="number" id="match_duration" min="15" max="120" value="45" required>
                        <div class="form-hint">Thời gian dự kiến mỗi trận</div>
                    </div>

                    <div class="form-group full">
                        <label>Giờ bắt đầu các buổi</label>
                        <div class="time-grid">
                            <div>
                                <label style="font-size:12px; color:#6c757d; margin-bottom:4px; display:block;">Sáng</label>
                                <input type="time" id="start_time_morning" value="08:00">
                            </div>
                            <div>
                                <label style="font-size:12px; color:#6c757d; margin-bottom:4px; display:block;">Chiều</label>
                                <input type="time" id="start_time_afternoon" value="14:00">
                            </div>
                            <div>
                                <label style="font-size:12px; color:#6c757d; margin-bottom:4px; display:block;">Tối</label>
                                <input type="time" id="start_time_evening" value="19:00">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MÔ TẢ -->
                <div class="section-label"><i class="fas fa-file-alt"></i> Mô tả</div>
                <div class="form-group full">
                    <textarea id="description" placeholder="Thông tin giới thiệu, thể lệ, đối tượng tham dự..." rows="4"></textarea>
                </div>

                <div id="form-message" class="alert"></div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" style="color: #1a1a2e; border-color: #e9ecef;" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <i class="fas fa-save"></i> Lưu giải đấu
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function() {
    'use strict';

    const config = window.SPORTSVN_CONFIG || {};
    const supabaseClient = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);

    let currentUser = null;
    let tournaments = [];

    // ============================
    // KHỞI TẠO
    // ============================
    async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = session.user;
        await loadTournaments();
    }

    // ============================
    // TẢI DANH SÁCH
    // ============================
    async function loadTournaments() {
        try {
            const { data, error } = await supabaseClient
                .from('tournaments')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;
            tournaments = data || [];
            renderTournaments();
        } catch (error) {
            console.error('Load error:', error);
            showAlert('Không tải được danh sách giải đấu: ' + error.message, 'error');
        }
    }

    // ============================
    // HIỂN THỊ DANH SÁCH
    // ============================
    function renderTournaments() {
        const container = document.getElementById('tournament-list');
        const countEl = document.getElementById('count');
        countEl.textContent = tournaments.length;

        if (tournaments.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-trophy"></i>
                    <p style="margin-bottom: 16px;">Chưa có giải đấu nào</p>
                    <button class="btn btn-primary" onclick="openCreateModal()">
                        <i class="fas fa-plus"></i> Tạo giải đấu đầu tiên
                    </button>
                </div>
            `;
            return;
        }

        container.innerHTML = tournaments.map(t => `
            <div class="tournament-card">
                <h3>${escapeHtml(t.name)}</h3>
                <div class="tournament-meta">
                    <span><i class="fas fa-tag"></i> ${escapeHtml(t.sport || '—')}</span>
                    <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(t.location || '—')}</span>
                    <span><i class="fas fa-calendar"></i> ${formatDate(t.start_date)} ${t.end_date ? '→ ' + formatDate(t.end_date) : ''}</span>
                    <span><span class="badge ${t.status || 'draft'}">${statusLabel(t.status)}</span></span>
                </div>

                <div class="tournament-stats">
                    <div class="stat-item">
                        <span class="value">${t.num_venues || 0}</span>
                        <span class="label">Sân</span>
                    </div>
                    <div class="stat-item">
                        <span class="value">${t.num_days || 0}</span>
                        <span class="label">Ngày</span>
                    </div>
                    <div class="stat-item">
                        <span class="value">${t.sessions_per_day || 0}</span>
                        <span class="label">Buổi/ngày</span>
                    </div>
                </div>

                <div class="card-actions">
                    <button class="btn-small btn-categories" onclick="goToCategories('${t.id}')">
                        <i class="fas fa-list"></i> Nội dung
                    </button>
                    <button class="btn-small btn-draw" onclick="goToDraw('${t.id}')">
                        <i class="fas fa-dice"></i> Bốc thăm
                    </button>
                    <button class="btn-small btn-edit" onclick="openEditModal('${t.id}')">
                        <i class="fas fa-edit"></i> Sửa
                    </button>
                    <button class="btn-small btn-delete" onclick="deleteTournament('${t.id}')">
                        <i class="fas fa-trash"></i> Xóa
                    </button>
                </div>
            </div>
        `).join('');
    }

    // ============================
    // MỞ MODAL TẠO MỚI
    // ============================
    window.openCreateModal = function() {
        document.getElementById('modal-title').textContent = 'Tạo giải đấu mới';
        document.getElementById('tournament-form').reset();
        document.getElementById('tournament-id').value = '';

        // Reset giá trị mặc định
        document.getElementById('num_venues').value = 4;
        document.getElementById('num_days').value = 3;
        document.getElementById('sessions_per_day').value = 2;
        document.getElementById('match_duration').value = 45;
        document.getElementById('start_time_morning').value = '08:00';
        document.getElementById('start_time_afternoon').value = '14:00';
        document.getElementById('start_time_evening').value = '19:00';
        document.getElementById('status').value = 'registration';

        document.getElementById('form-message').className = 'alert';
        document.getElementById('tournament-modal').classList.add('show');
    };

    // ============================
    // MỞ MODAL SỬA
    // ============================
    window.openEditModal = function(id) {
        const t = tournaments.find(x => x.id === id);
        if (!t) {
            alert('Không tìm thấy giải đấu!');
            return;
        }

        document.getElementById('modal-title').textContent = 'Sửa giải đấu';
        document.getElementById('tournament-id').value = t.id;
        document.getElementById('name').value = t.name || '';
        document.getElementById('sport').value = t.sport || '';
        document.getElementById('status').value = t.status || 'draft';
        document.getElementById('start_date').value = t.start_date || '';
        document.getElementById('end_date').value = t.end_date || '';
        document.getElementById('location').value = t.location || '';
        document.getElementById('description').value = t.description || '';

        document.getElementById('num_venues').value = t.num_venues || 4;
        document.getElementById('num_days').value = t.num_days || 3;
        document.getElementById('sessions_per_day').value = t.sessions_per_day || 2;
        document.getElementById('match_duration').value = t.match_duration || 45;
        document.getElementById('start_time_morning').value = t.start_time_morning || '08:00';
        document.getElementById('start_time_afternoon').value = t.start_time_afternoon || '14:00';
        document.getElementById('start_time_evening').value = t.start_time_evening || '19:00';

        document.getElementById('form-message').className = 'alert';
        document.getElementById('tournament-modal').classList.add('show');
    };

    // ============================
    // ĐÓNG MODAL
    // ============================
    window.closeModal = function() {
        document.getElementById('tournament-modal').classList.remove('show');
    };

    // ============================
    // TẠO SLUG
    // ============================
    function generateSlug(text) {
        const base = String(text || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .replace(/[^a-z0-9\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .slice(0, 80);

        return (base || 'giai-dau') + '-' + Date.now();
    }

    // ============================
    // XỬ LÝ SUBMIT
    // ============================
    window.handleSubmit = async function(event) {
        event.preventDefault();

        const id = document.getElementById('tournament-id').value;
        const nameValue = document.getElementById('name').value.trim();
        const numVenues = parseInt(document.getElementById('num_venues').value);

        const payload = {
            name: nameValue,
            slug: generateSlug(nameValue),
            sport: document.getElementById('sport').value,
            status: document.getElementById('status').value,
            start_date: document.getElementById('start_date').value,
            end_date: document.getElementById('end_date').value || null,
            location: document.getElementById('location').value.trim(),
            description: document.getElementById('description').value.trim() || null,
            num_venues: numVenues,
            num_days: parseInt(document.getElementById('num_days').value),
            sessions_per_day: parseInt(document.getElementById('sessions_per_day').value),
            match_duration: parseInt(document.getElementById('match_duration').value),
            start_time_morning: document.getElementById('start_time_morning').value,
            start_time_afternoon: document.getElementById('start_time_afternoon').value,
            start_time_evening: document.getElementById('start_time_evening').value,
            organizer_id: currentUser.id
        };

        if (!payload.name || !payload.sport || !payload.start_date || !payload.location) {
            showFormMessage('Vui lòng nhập đầy đủ các trường bắt buộc.', 'error');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';

        try {
            if (id) {
                // CẬP NHẬT
                delete payload.slug;
                const { error } = await supabaseClient
                    .from('tournaments')
                    .update(payload)
                    .eq('id', id);
                if (error) throw error;
                showAlert('✅ Cập nhật giải đấu thành công!', 'success');
            } else {
                // TẠO MỚI
                const { data: newTournament, error } = await supabaseClient
                    .from('tournaments')
                    .insert(payload)
                    .select()
                    .single();

                if (error) throw error;

                // TỰ ĐỘNG TẠO SÂN
                await createVenues(newTournament.id, numVenues, payload.location);

                showAlert(`✅ Tạo giải đấu thành công! Đã tạo ${numVenues} sân.`, 'success');
            }

            closeModal();
            await loadTournaments();
        } catch (error) {
            console.error('Save error:', error);
            showFormMessage('Lỗi: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Lưu giải đấu';
        }
    };

    // ============================
    // TẠO SÂN TỰ ĐỘNG
    // ============================
    async function createVenues(tournamentId, numVenues, venueName) {
        const venues = [];
        for (let i = 1; i <= numVenues; i++) {
            venues.push({
                tournament_id: tournamentId,
                venue_name: venueName,
                court_number: i,
                court_name: `Sân ${i}`
            });
        }

        const { error } = await supabaseClient.from('venues').insert(venues);
        if (error) {
            console.error('Create venues error:', error);
            throw new Error('Không tạo được sân: ' + error.message);
        }
    }

    // ============================
    // XÓA GIẢI
    // ============================
    window.deleteTournament = async function(id) {
        const t = tournaments.find(x => x.id === id);
        if (!t) {
            alert('Không tìm thấy giải đấu!');
            return;
        }

        if (!confirm(`Bạn có chắc muốn xóa giải đấu "${t.name}"?\n\nTất cả sân, nội dung, lịch thi đấu của giải này cũng sẽ bị xóa!\n\nHành động này KHÔNG THỂ HOÀN TÁC!`)) return;

        try {
            const { error } = await supabaseClient
                .from('tournaments')
                .delete()
                .eq('id', id);

            if (error) throw error;
            showAlert('✅ Đã xóa giải đấu!', 'success');
            await loadTournaments();
        } catch (error) {
            showAlert('Lỗi xóa: ' + error.message, 'error');
        }
    };

    // ============================
    // CHUYỂN TRANG
    // ============================
    window.goToDraw = function(id) {
        window.location.href = 'draw.html?tournament_id=' + id;
    };

    window.goToCategories = function(id) {
        window.location.href = 'categories.html?tournament_id=' + id;
    };

    // ============================
    // HELPERS
    // ============================
    function showAlert(message, type) {
        const el = document.getElementById('alert');
        el.textContent = message;
        el.className = 'alert show ' + type;
        setTimeout(() => { el.className = 'alert'; }, 5000);
    }

    function showFormMessage(message, type) {
        const el = document.getElementById('form-message');
        el.textContent = message;
        el.className = 'alert show ' + type;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return d.toLocaleDateString('vi-VN');
    }

    function statusLabel(status) {
        return {
            draft: 'Bản nháp',
            registration: 'Đăng ký',
            ongoing: 'Đang diễn ra',
            completed: 'Đã kết thúc',
            cancelled: 'Đã hủy'
        }[status] || 'Bản nháp';
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Chạy
    init();
})();
</script>

</body>
</html>
