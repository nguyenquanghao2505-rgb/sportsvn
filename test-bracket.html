<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Bracket Engine + Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { color: #c4f82a; margin-bottom: 8px; font-size: 24px; }
    h2 { color: #c4f82a; margin: 24px 0 12px; font-size: 18px; border-bottom: 2px solid #1c2333; padding-bottom: 8px; }
    .subtitle { color: #8b92a4; margin-bottom: 24px; }
    .btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      font-weight: 700; font-size: 14px; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
      margin-right: 8px; margin-bottom: 8px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #c4f82a; color: #0a0e1a; }
    .btn-primary:hover { background: #a8d91e; }
    .btn-success { background: #22c55e; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-secondary { background: #1c2333; color: #e2e8f0; border: 1px solid #2a3142; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin: 16px 0 24px;
    }
    .stat-card {
      background: #131823; padding: 16px; border-radius: 12px;
      border: 1px solid #2a3142;
    }
    .stat-label { color: #8b92a4; font-size: 12px; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #c4f82a; margin-top: 4px; }

    .test-section {
      background: #131823; border: 1px solid #2a3142;
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }
    .test-section h3 { color: #c4f82a; font-size: 15px; margin-bottom: 12px; }

    .log {
      background: #0d1117; border: 1px solid #2a3142;
      border-radius: 8px; padding: 12px;
      font-family: 'SF Mono', monospace; font-size: 12px;
      color: #8b92a4; max-height: 300px; overflow-y: auto;
    }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #161b22; }
    .log-entry.ok { color: #22c55e; }
    .log-entry.err { color: #ef4444; }
    .log-entry.warn { color: #f59e0b; }
  </style>
</head>
<body>

<div class="container">
  <h1>🧪 Test Bracket + Zoom/Pan</h1>
  <p class="subtitle">Bracket engine + renderer giống referee.vn — thử zoom, pan, click match</p>

  <div class="test-section">
    <h3>Chọn kịch bản test:</h3>
    <button class="btn btn-primary" onclick="runTest(8)">▶ 8 đội</button>
    <button class="btn btn-primary" onclick="runTest(16)">▶ 16 đội</button>
    <button class="btn btn-primary" onclick="runTest(13)">▶ 13 đội (BYE)</button>
    <button class="btn btn-primary" onclick="runTest(32)">▶ 32 đội</button>
    <button class="btn btn-success" onclick="simulateAll()">⚡ Mô phỏng tất cả trận</button>
    <button class="btn btn-secondary" onclick="resetAll()">🔄 Reset</button>
  </div>

  <div id="stats-container"></div>

  <h2>📊 Sơ đồ bracket (zoom/pan được)</h2>
  <div id="bracket-container"></div>

  <h2>📋 Log</h2>
  <div id="log" class="log"></div>
</div>

<script type="module">
  import {
    createBracket, recordWinner, validateBracket,
    getBracketStats, getReadyMatches, resetBracket,
  } from './bracket-engine.js';
  import { renderBracket, injectBracketStyles } from './bracket-renderer.js';

  injectBracketStyles();

  let currentBracket = null;

  const logEl = document.getElementById('log');
  const bracketContainer = document.getElementById('bracket-container');
  const statsContainer = document.getElementById('stats-container');

  function log(msg, type = '') {
    const div = document.createElement('div');
    div.className = 'log-entry ' + type;
    div.textContent = `[${new Date().toLocaleTimeString('vi-VN')}] ${msg}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() { logEl.innerHTML = ''; }

  function makeTeams(n, prefix = 'Đội') {
    const teams = [];
    for (let i = 1; i <= n; i++) {
      teams.push({
        name: `${prefix} ${i}`,
        club: `CLB ${Math.ceil(i / 4)}`,
      });
    }
    return teams;
  }

  window.runTest = function (n) {
    clearLog();
    log(`=== TEST ${n} ĐỘI ===`, 'ok');
    const teams = makeTeams(n, 'VĐV');
    currentBracket = createBracket(teams);
    log(`✅ Tạo bracket: ${currentBracket.bracketSize} slots, ${currentBracket.numByes} BYE`, 'ok');
    renderAll();
  };

  window.simulateAll = function () {
    if (!currentBracket) {
      log('⚠️ Chưa có bracket, bấm chọn test trước', 'warn');
      return;
    }
    let round = 0;
    let safety = 0;

    while (safety < 100) {
      safety++;
      const ready = getReadyMatches(currentBracket);
      if (ready.length === 0) {
        log('🎉 Không còn trận nào cần đấu', 'ok');
        break;
      }
      log(`--- Vòng ${round + 1}: ${ready.length} trận ---`);

      ready.forEach((m) => {
        const scoreA = Math.floor(Math.random() * 11) + 1;
        const scoreB = Math.floor(Math.random() * 11) + 1;
        const winner = scoreA > scoreB ? 'A' : 'B';
        try {
          recordWinner(currentBracket, m.id, winner, scoreA, scoreB);
        } catch (err) {
          log(`❌ ${m.id}: ${err.message}`, 'err');
        }
      });
      round++;
    }
    renderAll();
  };

  window.resetAll = function () {
    if (!currentBracket) return;
    resetBracket(currentBracket);
    renderAll();
    log('🔄 Đã reset bracket', 'ok');
  };

  function renderAll() {
    if (!currentBracket) return;

    const stats = getBracketStats(currentBracket);
    statsContainer.innerHTML = `
      <div class="stats">
        <div class="stat-card"><div class="stat-label">Đội</div><div class="stat-value">${stats.teamCount}</div></div>
        <div class="stat-card"><div class="stat-label">Bracket size</div><div class="stat-value">${stats.bracketSize}</div></div>
        <div class="stat-card"><div class="stat-label">BYE</div><div class="stat-value">${stats.numByes}</div></div>
        <div class="stat-card"><div class="stat-label">Vòng</div><div class="stat-value">${stats.totalRounds}</div></div>
        <div class="stat-card"><div class="stat-label">Trận xong</div><div class="stat-value">${stats.doneMatches}/${stats.totalMatches}</div></div>
        <div class="stat-card"><div class="stat-label">Tiến độ</div><div class="stat-value">${stats.progress}%</div></div>
      </div>
    `;

    renderBracket(currentBracket, bracketContainer, {
      onMatchClick: (match, rIdx, mIdx) => {
        log(`🖱️ Click: ${match.id} — ${match.teamA?.name || '?'} vs ${match.teamB?.name || '?'} (${match.status})`, 'warn');
      },
    });

    const v = validateBracket(currentBracket);
    if (v.valid && v.warningCount === 0) {
      log('✅ Bracket HỢP LỆ', 'ok');
    } else {
      log(`⚠️ ${v.errorCount} lỗi, ${v.warningCount} cảnh báo`, v.valid ? 'warn' : 'err');
    }
  }

  log('🚀 Sẵn sàng. Chọn số đội để test.');
</script>

</body>
</html>
