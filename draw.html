<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốc thăm tự động - SportsVN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS để xuất Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f2f8; min-height: 100vh; padding: 24px; }
        .draw-container { max-width: 1400px; margin: 0 auto; }

        /* HEADER */
        .draw-header {
            background: linear-gradient(135deg, #0d1b3e, #1a3a7a);
            border-radius: 20px;
            padding: 28px 32px;
            color: #fff;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .draw-header h1 { font-size: 26px; margin-bottom: 6px; }
        .draw-header p { opacity: 0.85; font-size: 14px; }
        .draw-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* BUTTONS */
        .btn {
            padding: 11px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { box-shadow: 0 8px 20px rgba(233,69,96,0.4); }
        .btn-success { background: #00b894; color: #fff; }
        .btn-success:hover { box-shadow: 0 8px 20px rgba(0,184,148,0.4); }
        .btn-warning { background: #fdcb6e; color: #1a1a2e; }
        .btn-info { background: #0984e3; color: #fff; }
        .btn-outline { background: transparent; color: #fff; border: 2px solid #fff; }
        .btn-outline:hover { background: #fff; color: #0d1b3e; }
        .btn-danger { background: #d63031; color: #fff; }

        /* PANELS */
        .panel {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .step-num {
            background: #1a3a7a;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        /* FORM */
        .form-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #1a3a7a;
            outline: none;
        }

        /* TEAMS LIST */
        .teams-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }
        .team-item {
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .team-item .team-name { font-weight: 700; color: #1a1a2e; }
        .team-item .team-club { font-size: 11px; color: #6c757d; }
        .team-item .team-club.has-club { color: #1a3a7a; font-weight: 600; }
        .team-item .remove-btn {
            background: #e94560;
            color: #fff;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* DRAW TYPE SELECTOR */
        .draw-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .draw-type-card {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .draw-type-card:hover { border-color: #1a3a7a; transform: translateY(-2px); }
        .draw-type-card.selected { border-color: #1a3a7a; background: #f0f4ff; }
        .draw-type-card input[type="radio"] { margin-top: 4px; }
        .draw-type-card .info strong { display: block; color: #1a1a2e; font-size: 15px; margin-bottom: 4px; }
        .draw-type-card .info small { color: #6c757d; font-size: 12px; line-height: 1.4; }

        /* CONFIG BOX */
        .config-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-top: 16px;
            border-left: 4px solid #1a3a7a;
        }
        .config-box h4 {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .config-box .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .config-box .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .config-box .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .config-box .checkbox-row label {
            cursor: pointer;
            font-weight: 500;
        }

        /* RESULT AREA */
        .result-area {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            min-height: 200px;
            overflow-x: auto;
        }
        .result-area h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #1a1a2e;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #fff;
        }
        .result-table th, .result-table td {
            border: 1px solid #dee2e6;
            padding: 8px 10px;
            text-align: left;
        }
        .result-table th {
            background: #1a3a7a;
            color: #fff;
            font-weight: 700;
            text-align: center;
        }
        .result-table td.center { text-align: center; }
        .result-table tr.bye-row { background: #fff3cd; }
        .result-table tr.bye-row td { color: #856404; font-style: italic; }

        /* BRACKET VIEW */
        .bracket-view {
            display: flex;
            gap: 40px;
            overflow-x: auto;
            padding: 20px 0;
        }
        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 220px;
        }
        .bracket-round h4 {
            text-align: center;
            font-size: 13px;
            color: #1a3a7a;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .bracket-match {
            background: #fff;
            border: 2px solid #1a3a7a;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .bracket-match .player {
            padding: 4px 0;
            border-bottom: 1px dashed #dee2e6;
        }
        .bracket-match .player:last-child { border-bottom: none; }
        .bracket-match .player.bye { color: #adb5bd; font-style: italic; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #adb5bd;
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .config-box .config-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="draw-container">
        <!-- HEADER -->
        <div class="draw-header">
            <div>
                <h1><i class="fas fa-dice"></i> Bốc thăm tự động - Nâng cao</h1>
                <p>Hệ thống bốc thăm giải bóng bàn SportsVN 2026</p>
            </div>
            <div class="draw-header-actions">
                <button class="btn btn-outline" onclick="loadSampleData()">
                    <i class="fas fa-file-import"></i> Nạp mẫu
                </button>
                <button class="btn btn-outline" onclick="clearAll()">
                    <i class="fas fa-trash"></i> Xóa hết
                </button>
            </div>
        </div>

        <!-- BƯỚC 1: NHẬP DANH SÁCH VĐV -->
        <div class="panel">
            <div class="panel-title">
                <span class="step-num">1</span>
                Nhập danh sách VĐV / Đội
                <span id="countBadge" style="background:#e94560;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;margin-left:8px;">0</span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Tên VĐV / Đội</label>
                    <input type="text" id="playerName" placeholder="VD: Hiếu (NBK)" onkeypress="if(event.key==='Enter') addPlayer()">
                </div>
                <div class="form-group">
                    <label>CLB / Đơn vị</label>
                    <input type="text" id="playerClub" placeholder="VD: NBK" onkeypress="if(event.key==='Enter') addPlayer()">
                </div>
                <div class="form-group">
                    <label>Số hạt giống (nếu có)</label>
                    <input type="number" id="playerSeed" placeholder="VD: 1" min="1">
                </div>
                <button class="btn btn-primary" onclick="addPlayer()">
                    <i class="fas fa-plus"></i> Thêm
                </button>
            </div>
            <div id="teamsList" class="teams-list"></div>
        </div>

        <!-- BƯỚC 2: CẤU HÌNH BỐC THĂM -->
        <div class="panel">
            <div class="panel-title">
                <span class="step-num">2</span>
                Cấu hình bốc thăm
            </div>
            <div class="draw-types">
                <label class="draw-type-card selected" onclick="selectDrawType(this)">
                    <input type="radio" name="drawType" value="knockout" checked>
                    <div class="info">
                        <strong>Loại trực tiếp (Knockout)</strong>
                        <small>Bốc thăm nhánh đấu loại trực tiếp. Hỗ trợ BYE, tránh trùng CLB.</small>
                    </div>
                </label>
                <label class="draw-type-card" onclick="selectDrawType(this)">
                    <input type="radio" name="drawType" value="roundrobin">
                    <div class="info">
                        <strong>Vòng tròn</strong>
                        <small>Tất cả đấu với tất cả. Tính điểm, xếp hạng.</small>
                    </div>
                </label>
                <label class="draw-type-card" onclick="selectDrawType(this)">
                    <input type="radio" name="drawType" value="group">
                    <div class="info">
                        <strong>Vòng tròn chia bảng</strong>
                        <small>Chia thành nhiều bảng, đấu vòng tròn trong bảng. Hỗ trợ tách CLB.</small>
                    </div>
                </label>
            </div>

            <!-- CẤU HÌNH NÂNG CAO -->
            <div class="config-box">
                <h4><i class="fas fa-cog"></i> Cấu hình nâng cao</h4>

                <div class="config-row">
                    <div class="form-group">
                        <label>Số bảng (cho vòng tròn chia bảng)</label>
                        <input type="number" id="numGroups" value="4" min="2" max="16">
                    </div>
                    <div class="form-group">
                        <label>Slot bỏ (BYE) - cách nhau dấu phẩy</label>
                        <input type="text" id="byeSlots" placeholder="VD: 2,15,18,34,47,50">
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="avoidSameClub" checked>
                    <label for="avoidSameClub">Không cho VĐV cùng CLB gặp nhau (vòng đầu)</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="separateClub12" checked>
                    <label for="separateClub12">Tách VĐV "1" và "2" cùng CLB ra bảng khác (vòng tròn chia bảng)</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="distributeSeeds" checked>
                    <label for="distributeSeeds">Phân bổ hạt giống đều các nhánh/bảng</label>
                </div>
            </div>
        </div>

        <!-- BƯỚC 3: KẾT QUẢ -->
        <div class="panel">
            <div class="panel-title">
                <span class="step-num">3</span>
                Kết quả bốc thăm
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
                <button class="btn btn-success" onclick="doDraw()">
                    <i class="fas fa-dice"></i> BỐC THĂM NGAY
                </button>
                <button class="btn btn-info" onclick="exportExcel()" id="exportBtn" disabled>
                    <i class="fas fa-file-excel"></i> Xuất Excel
                </button>
                <button class="btn btn-warning" onclick="exportJSON()" id="exportJsonBtn" disabled>
                    <i class="fas fa-file-code"></i> Xuất JSON
                </button>
            </div>
            <div id="resultArea" class="result-area">
                <div class="empty-state">
                    <i class="fas fa-dice"></i>
                    <p>Chưa có kết quả. Nhập danh sách VĐV và bấm "BỐC THĂM NGAY".</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let players = []; // {name, club, seed}
        let lastResult = null; // Lưu kết quả bốc thăm gần nhất

        // ============================================================
        // QUẢN LÝ DANH SÁCH VĐV
        // ============================================================
        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const club = document.getElementById('playerClub').value.trim();
            const seed = parseInt(document.getElementById('playerSeed').value) || null;

            if (!name) { alert('Vui lòng nhập tên VĐV!'); return; }

            players.push({ name, club: club || 'Không rõ', seed });
            document.getElementById('playerName').value = '';
            document.getElementById('playerClub').value = '';
            document.getElementById('playerSeed').value = '';
            document.getElementById('playerName').focus();

            renderPlayers();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        function renderPlayers() {
            const list = document.getElementById('teamsList');
            document.getElementById('countBadge').textContent = players.length;

            if (players.length === 0) {
                list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#adb5bd;padding:20px;">Chưa có VĐV nào. Nhập tên và bấm "Thêm".</div>';
                return;
            }

            list.innerHTML = players.map((p, i) => `
                <div class="team-item">
                    <div style="flex:1;min-width:0;">
                        <div class="team-name">${escapeHtml(p.name)}</div>
                        <div class="team-club ${p.club !== 'Không rõ' ? 'has-club' : ''}">
                            ${escapeHtml(p.club)}${p.seed ? ' • Hạt giống #' + p.seed : ''}
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removePlayer(${i})" title="Xóa">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function clearAll() {
            if (players.length > 0 && !confirm('Xóa toàn bộ danh sách VĐV?')) return;
            players = [];
            lastResult = null;
            renderPlayers();
            document.getElementById('resultArea').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-dice"></i>
                    <p>Chưa có kết quả. Nhập danh sách VĐV và bấm "BỐC THĂM NGAY".</p>
                </div>`;
            document.getElementById('exportBtn').disabled = true;
            document.getElementById('exportJsonBtn').disabled = true;
        }

        function loadSampleData() {
            players = [
                { name: 'Hiếu', club: 'NBK', seed: null },
                { name: 'Huy', club: 'NBK', seed: null },
                { name: 'Phong', club: 'NBK', seed: null },
                { name: 'Minh', club: 'H.Cường', seed: null },
                { name: 'Bảo', club: 'H.Cường', seed: null },
                { name: 'An', club: 'H.Cường', seed: null },
                { name: 'Triển', club: 'NTT T.Kỳ', seed: null },
                { name: 'Minh', club: 'VX ĐL', seed: null },
                { name: 'Anh', club: 'VX ĐL', seed: null },
                { name: 'Đạt', club: 'VX ĐL', seed: null },
                { name: 'Quân', club: 'VX ĐL', seed: null },
                { name: 'Lâm', club: 'P.Thanh', seed: null },
                { name: 'Nguyên', club: 'P.Thanh', seed: null },
                { name: 'Phúc', club: 'P.Thanh', seed: null },
                { name: 'Đức', club: 'QK5', seed: null },
                { name: 'Anh', club: 'QK5', seed: null },
                { name: 'Triết', club: 'QK5', seed: null },
                { name: 'Khôi', club: 'QK5', seed: null },
                { name: 'Hào', club: 'TK Đông', seed: null },
                { name: 'Long', club: 'TK Đông', seed: null },
                { name: 'Huy', club: 'TK Đông', seed: null },
                { name: 'Khang', club: 'TK Đông', seed: null },
                { name: 'Vũ', club: 'An Khê', seed: null },
                { name: 'Phú', club: 'An Khê', seed: null },
                { name: 'Thiên', club: 'An Khê', seed: null },
                { name: 'Duy', club: 'An Khê', seed: null },
                { name: 'Quân', club: 'TML', seed: null },
                { name: 'Lân', club: 'TML', seed: null },
                { name: 'Thiên', club: 'TML', seed: null },
                { name: 'Thành', club: 'TML', seed: null },
                { name: 'Minh', club: 'AT Sport', seed: null },
                { name: 'Huy', club: 'Quế Sơn', seed: null },
                { name: 'Thụy', club: 'Ngọc Trí', seed: null },
                { name: 'Nhật', club: 'Ngọc Trí', seed: null },
                { name: 'Lâm', club: 'Ngọc Trí', seed: null },
                { name: 'N.Minh', club: 'Ngọc Trí', seed: null },
                { name: 'Minh', club: 'Đa Phước', seed: null },
                { name: 'Tuệ', club: 'Đa Phước', seed: null },
            ];
            renderPlayers();
        }

        // ============================================================
        // CHỌN LOẠI BỐC THĂM
        // ============================================================
        function selectDrawType(el) {
            document.querySelectorAll('.draw-type-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input[type="radio"]').checked = true;
        }

        function getDrawType() {
            return document.querySelector('input[name="drawType"]:checked').value;
        }

        // ============================================================
        // THUẬT TOÁN BỐC THĂM
        // ============================================================

        /**
         * Bốc thăm loại trực tiếp (Knockout)
         * @param {Array} players - Danh sách VĐV
         * @param {Array} byeSlots - Danh sách vị trí BYE (1-indexed)
         * @param {Boolean} avoidSameClub - Tránh cùng CLB gặp nhau vòng đầu
         * @returns {Object} - { bracket: Array, numSlots: Number }
         */
        function drawKnockout(players, byeSlots, avoidSameClub) {
            const n = players.length;
            if (n < 2) throw new Error('Cần ít nhất 2 VĐV để bốc thăm knockout.');

            // Tìm lũy thừa 2 gần nhất >= n
            let numSlots = 2;
            while (numSlots < n) numSlots *= 2;
            // Nếu n <= numSlots/2 thì giảm xuống (VD: 58 -> 64, 33 -> 64 hay 32?)
            // Theo file mẫu: 58 VĐV -> nhánh 64. Vậy giữ numSlots = 2^k >= n.
            if (numSlots / 2 >= n && numSlots > 2) {
                // Nếu n <= numSlots/2, có thể dùng numSlots/2
                // Nhưng theo file mẫu 58 -> 64 (không phải 32 vì 32 < 58)
                // 33 -> 64? Hay 32? File mẫu 37 VĐV -> nhánh 64.
                // Vậy quy tắc: numSlots = 2^k >= n
            }

            // Số BYE cần = numSlots - n
            const numByes = numSlots - n;

            // Nếu người dùng cung cấp byeSlots, dùng đúng số đó
            // Nếu không, tự tính
            let finalByeSlots = [];
            if (byeSlots && byeSlots.length > 0) {
                finalByeSlots = byeSlots.filter(s => s >= 1 && s <= numSlots);
            } else {
                // Tự động chọn BYE: ưu tiên các vị trí đối xứng
                // Ví dụ numSlots=64, numByes=6 -> chọn 2,15,18,34,47,50
                finalByeSlots = autoSelectByeSlots(numSlots, numByes);
            }

            // Tạo mảng slot
            const slots = new Array(numSlots + 1).fill(null); // 1-indexed
            finalByeSlots.forEach(s => { slots[s] = { bye: true }; });

            // Lấy các slot trống
            const emptySlots = [];
            for (let i = 1; i <= numSlots; i++) {
                if (!slots[i]) emptySlots.push(i);
            }

            // Xáo trộn players
            const shuffled = shuffle([...players]);

            // Nếu avoidSameClub, cố gắng xếp để 2 VĐV cùng CLB không gặp nhau vòng đầu
            // Vòng đầu: cặp (1,2), (3,4), (5,6), ...
            // Ta sẽ xếp theo cách: chia players thành các nhóm CLB, rồi rải đều
            let orderedPlayers = shuffled;
            if (avoidSameClub) {
                orderedPlayers = arrangeAvoidSameClub(shuffled, numSlots);
            }

            // Gán players vào emptySlots
            for (let i = 0; i < orderedPlayers.length; i++) {
                slots[emptySlots[i]] = { player: orderedPlayers[i], bye: false };
            }

            // Tạo bracket: mảng các cặp đấu vòng 1
            const bracket = [];
            for (let i = 1; i <= numSlots; i += 2) {
                const p1 = slots[i];
                const p2 = slots[i + 1];
                bracket.push({
                    slot1: i,
                    slot2: i + 1,
                    player1: p1 && !p1.bye ? p1.player : null,
                    player2: p2 && !p2.bye ? p2.player : null,
                    bye1: p1 ? p1.bye : false,
                    bye2: p2 ? p2.bye : false,
                });
            }

            return { bracket, numSlots, byeSlots: finalByeSlots, slots };
        }

        /**
         * Tự động chọn BYE slots đối xứng
         */
        function autoSelectByeSlots(numSlots, numByes) {
            if (numByes === 0) return [];
            const byes = [];
            // Chọn các vị trí đối xứng qua tâm
            // Ví dụ numSlots=64, numByes=6: 2,15,18,34,47,50 (theo file mẫu)
            // Quy tắc: bỏ ở các nhánh, mỗi nhánh bỏ 1-2 vị trí
            // Đơn giản: chọn ngẫu nhiên nhưng đối xứng
            const half = numSlots / 2;
            const perHalf = Math.ceil(numByes / 2);
            for (let i = 0; i < perHalf; i++) {
                const pos = Math.floor((i + 1) * half / (perHalf + 1)) + 1;
                if (!byes.includes(pos) && pos <= numSlots) byes.push(pos);
                const mirror = numSlots - pos + 1;
                if (!byes.includes(mirror) && mirror >= 1 && byes.length < numByes) byes.push(mirror);
            }
            return byes.slice(0, numByes).sort((a, b) => a - b);
        }

        /**
         * Sắp xếp VĐV để tránh cùng CLB gặp nhau vòng đầu
         * Ý tưởng: chia thành các nhóm CLB, rồi rải xen kẽ
         */
        function arrangeAvoidSameClub(players, numSlots) {
            // Nhóm theo CLB
            const byClub = {};
            players.forEach(p => {
                if (!byClub[p.club]) byClub[p.club] = [];
                byClub[p.club].push(p);
            });

            // Sắp xếp CLB theo số lượng giảm dần (CLB đông xếp trước)
            const clubs = Object.keys(byClub).sort((a, b) => byClub[b].length - byClub[a].length);

            // Rải xen kẽ: lấy lần lượt từng CLB
            const result = [];
            let hasMore = true;
            const indices = {};
            clubs.forEach(c => indices[c] = 0);

            while (hasMore) {
                hasMore = false;
                for (const club of clubs) {
                    if (indices[club] < byClub[club].length) {
                        result.push(byClub[club][indices[club]]);
                        indices[club]++;
                        hasMore = true;
                    }
                }
            }

            return result;
        }

        /**
         * Bốc thăm vòng tròn chia bảng
         * @param {Array} players
         * @param {Number} numGroups
         * @param {Boolean} separateClub12 - Tách VĐV cùng CLB ra bảng khác
         * @returns {Object} - { groups: Array<Array>, numGroups }
         */
        function drawGroups(players, numGroups, separateClub12) {
            const n = players.length;
            if (n < numGroups) throw new Error('Số VĐV phải >= số bảng.');

            // Xáo trộn
            let shuffled = shuffle([...players]);

            // Nếu separateClub12, cố gắng tách VĐV cùng CLB ra bảng khác
            if (separateClub12) {
                shuffled = arrangeGroupsAvoidSameClub(shuffled, numGroups);
            }

            // Chia đều vào các bảng
            const groups = Array.from({ length: numGroups }, () => []);
            shuffled.forEach((p, i) => {
                groups[i % numGroups].push(p);
            });

            return { groups, numGroups };
        }

        /**
         * Sắp xếp VĐV để tách cùng CLB ra bảng khác
         */
        function arrangeGroupsAvoidSameClub(players, numGroups) {
            // Nhóm theo CLB
            const byClub = {};
            players.forEach(p => {
                if (!byClub[p.club]) byClub[p.club] = [];
                byClub[p.club].push(p);
            });

            // Sắp xếp CLB theo số lượng giảm dần
            const clubs = Object.keys(byClub).sort((a, b) => byClub[b].length - byClub[a].length);

            // Rải xen kẽ
            const result = [];
            let hasMore = true;
            const indices = {};
            clubs.forEach(c => indices[c] = 0);

            while (hasMore) {
                hasMore = false;
                for (const club of clubs) {
                    if (indices[club] < byClub[club].length) {
                        result.push(byClub[club][indices[club]]);
                        indices[club]++;
                        hasMore = true;
                    }
                }
            }

            return result;
        }

        /**
         * Xáo trộn mảng (Fisher-Yates)
         */
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============================================================
        // THỰC HIỆN BỐC THĂM
        // ============================================================
        function doDraw() {
            if (players.length < 2) {
                alert('Cần ít nhất 2 VĐV để bốc thăm!');
                return;
            }

            const drawType = getDrawType();
            const byeSlotsStr = document.getElementById('byeSlots').value.trim();
            const byeSlots = byeSlotsStr
                ? byeSlotsStr.split(',').map(s => parseInt(s.trim())).filter(s => !isNaN(s))
                : [];
            const avoidSameClub = document.getElementById('avoidSameClub').checked;
            const separateClub12 = document.getElementById('separateClub12').checked;
            const numGroups = parseInt(document.getElementById('numGroups').value) || 4;

            try {
                if (drawType === 'knockout') {
                    lastResult = {
                        type: 'knockout',
                        data: drawKnockout(players, byeSlots, avoidSameClub),
                        players: [...players],
                        config: { byeSlots, avoidSameClub },
                        timestamp: new Date().toISOString(),
                    };
                } else if (drawType === 'roundrobin') {
                    lastResult = {
                        type: 'roundrobin',
                        data: { players: shuffle([...players]) },
                        players: [...players],
                        config: {},
                        timestamp: new Date().toISOString(),
                    };
                } else if (drawType === 'group') {
                    lastResult = {
                        type: 'group',
                        data: drawGroups(players, numGroups, separateClub12),
                        players: [...players],
                        config: { numGroups, separateClub12 },
                        timestamp: new Date().toISOString(),
                    };
                }

                renderResult();
                document.getElementById('exportBtn').disabled = false;
                document.getElementById('exportJsonBtn').disabled = false;
            } catch (err) {
                alert('Lỗi bốc thăm: ' + err.message);
            }
        }

        // ============================================================
        // HIỂN THỊ KẾT QUẢ
        // ============================================================
        function renderResult() {
            const area = document.getElementById('resultArea');
            if (!lastResult) {
                area.innerHTML = '<div class="empty-state"><i class="fas fa-dice"></i><p>Chưa có kết quả.</p></div>';
                return;
            }

            if (lastResult.type === 'knockout') {
                area.innerHTML = renderKnockoutResult(lastResult.data);
            } else if (lastResult.type === 'roundrobin') {
                area.innerHTML = renderRoundRobinResult(lastResult.data);
            } else if (lastResult.type === 'group') {
                area.innerHTML = renderGroupResult(lastResult.data);
            }
        }

        function renderKnockoutResult(data) {
            const { bracket, numSlots, byeSlots } = data;
            let html = `<h3><i class="fas fa-sitemap"></i> Sơ đồ nhánh đấu (${numSlots} slot, ${byeSlots.length} BYE)</h3>`;
            html += `<p style="margin-bottom:12px;color:#6c757d;font-size:13px;">BYE tại các vị trí: ${byeSlots.join(', ')}</p>`;
            html += '<table class="result-table"><thead><tr>';
            html += '<th>Slot</th><th>VĐV 1</th><th>CLB 1</th><th>VĐV 2</th><th>CLB 2</th><th>Ghi chú</th>';
            html += '</tr></thead><tbody>';

            bracket.forEach((m, i) => {
                const p1 = m.player1;
                const p2 = m.player2;
                const isBye = m.bye1 || m.bye2;
                html += `<tr class="${isBye ? 'bye-row' : ''}">`;
                html += `<td class="center">${m.slot1}-${m.slot2}</td>`;
                html += `<td>${p1 ? escapeHtml(p1.name) : '<i>BYE</i>'}</td>`;
                html += `<td>${p1 ? escapeHtml(p1.club) : '-'}</td>`;
                html += `<td>${p2 ? escapeHtml(p2.name) : '<i>BYE</i>'}</td>`;
                html += `<td>${p2 ? escapeHtml(p2.club) : '-'}</td>`;
                html += `<td>${isBye ? 'BYE - đi tiếp' : ''}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        function renderRoundRobinResult(data) {
            const { players } = data;
            let html = `<h3><i class="fas fa-sync-alt"></i> Vòng tròn (${players.length} VĐV)</h3>`;
            html += '<table class="result-table"><thead><tr>';
            html += '<th>STT</th><th>VĐV</th><th>CLB</th>';
            html += '</tr></thead><tbody>';
            players.forEach((p, i) => {
                html += `<tr><td class="center">${i + 1}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.club)}</td></tr>`;
            });
            html += '</tbody></table>';
            html += `<p style="margin-top:12px;color:#6c757d;font-size:13px;">Tổng số trận: ${players.length * (players.length - 1) / 2}</p>`;
            return html;
        }

        function renderGroupResult(data) {
            const { groups } = data;
            let html = `<h3><i class="fas fa-layer-group"></i> Chia bảng (${groups.length} bảng)</h3>`;

            groups.forEach((group, gi) => {
                const groupName = String.fromCharCode(65 + gi); // A, B, C...
                html += `<h4 style="margin:16px 0 8px;color:#1a3a7a;">Bảng ${groupName} (${group.length} VĐV)</h4>`;
                html += '<table class="result-table"><thead><tr>';
                html += '<th>STT</th><th>VĐV</th><th>CLB</th>';
                html += '</tr></thead><tbody>';
                group.forEach((p, i) => {
                    html += `<tr><td class="center">${i + 1}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.club)}</td></tr>`;
                });
                html += '</tbody></table>';

                // Ma trận đấu vòng tròn
                html += '<table class="result-table" style="margin-top:8px;"><thead><tr><th>MS</th>';
                group.forEach((_, i) => html += `<th>${i + 1}</th>`);
                html += '</tr></thead><tbody>';
                group.forEach((p, i) => {
                    html += `<tr><td class="center"><b>${i + 1}</b></td>`;
                    group.forEach((_, j) => {
                        if (i === j) html += '<td style="background:#f1f3f5;"></td>';
                        else if (i < j) html += `<td class="center">${i + 1}-${j + 1}</td>`;
                        else html += '<td></td>';
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
            });

            return html;
        }

        // ============================================================
        // XUẤT EXCEL (SheetJS) - CẤU TRÚC GIỐNG FILE MẪU
        // ============================================================
        function exportExcel() {
            if (!lastResult) {
                alert('Chưa có kết quả để xuất!');
                return;
            }

            const wb = XLSX.utils.book_new();

            if (lastResult.type === 'knockout') {
                exportKnockoutSheets(wb, lastResult);
            } else if (lastResult.type === 'roundrobin') {
                exportRoundRobinSheet(wb, lastResult);
            } else if (lastResult.type === 'group') {
                exportGroupSheets(wb, lastResult);
            }

            // Sheet "Lịch thi đấu chung" (tổng hợp)
            exportScheduleSheet(wb, lastResult);

            // Xuất file
            const fileName = `BocTham_SportsVN_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        /**
         * Xuất sheet Knockout theo cấu trúc file mẫu
         */
        function exportKnockoutSheets(wb, result) {
            const { bracket, numSlots, byeSlots, slots } = result.data;
            const players = result.players;

            // --- Sheet chính: Sơ đồ nhánh ---
            const data = [];

            // Header
            data.push([`ĐƠN NAM (${players.length} VĐV) - BỐC THĂM KNOCKOUT`]);
            data.push([]);
            data.push(['TT', 'BYE', '', 'VĐV', '', '', 'Ngày', 'Bàn', 'Trận', '', '', '', '', 'TT', '', 'Nhập', 'Tên VĐV', '', 'Ghi chú']);

            // Tạo map: slot -> player
            const slotMap = {};
            for (let i = 1; i <= numSlots; i++) {
                slotMap[i] = slots[i] || null;
            }

            // Tính số vòng
            const rounds = Math.log2(numSlots);

            // Xuất từng slot
            for (let i = 1; i <= numSlots; i++) {
                const s = slotMap[i];
                const isBye = s && s.bye;
                const player = s && s.player ? s.player : null;
                const row = [];
                row.push(i); // TT
                row.push(isBye ? 'X' : ''); // BYE
                row.push('');
                row.push(player ? player.name : (isBye ? '' : '')); // VĐV
                row.push('');
                row.push('');
                row.push(''); // Ngày
                row.push(''); // Bàn
                row.push(''); // Trận
                row.push('');
                row.push('');
                row.push('');
                row.push('');
                row.push(i); // TT (cột N)
                row.push('');
                row.push('');
                row.push(player ? `${player.name} (${player.club})` : ''); // Tên VĐV (cột Q)
                row.push('');
                row.push(isBye ? `BYE slot ${i}` : ''); // Ghi chú
                data.push(row);
            }

            // Ghi chú nhánh bỏ
            data.push([]);
            data.push(['GHI CHÚ NHÁNH BỎ (BYE):']);
            byeSlots.forEach((s, i) => {
                data.push([`Nhánh ${i + 1} bỏ: ${s}`]);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);

            // Set column widths
            ws['!cols'] = [
                { wch: 5 },  // A: TT
                { wch: 5 },  // B: BYE
                { wch: 5 },  // C
                { wch: 20 }, // D: VĐV
                { wch: 5 },  // E
                { wch: 5 },  // F
                { wch: 12 }, // G: Ngày
                { wch: 6 },  // H: Bàn
                { wch: 6 },  // I: Trận
                { wch: 5 },  // J
                { wch: 5 },  // K
                { wch: 5 },  // L
                { wch: 5 },  // M
                { wch: 5 },  // N: TT
                { wch: 5 },  // O
                { wch: 8 },  // P: Nhập
                { wch: 25 }, // Q: Tên VĐV
                { wch: 5 },  // R
                { wch: 20 }, // S: Ghi chú
            ];

            const sheetName = `Don_${players.length}VDV`;
            XLSX.utils.book_append_sheet(wb, ws, sheetName);

            // --- Sheet phụ: Danh sách VĐV ---
            const listData = [['STT', 'Tên VĐV', 'CLB', 'Hạt giống']];
            players.forEach((p, i) => {
                listData.push([i + 1, p.name, p.club, p.seed || '']);
            });
            const wsList = XLSX.utils.aoa_to_sheet(listData);
            wsList['!cols'] = [{ wch: 6 }, { wch: 25 }, { wch: 20 }, { wch: 10 }];
            XLSX.utils.book_append_sheet(wb, wsList, 'Danh_sach_VDV');
        }

        /**
         * Xuất sheet Round Robin
         */
        function exportRoundRobinSheet(wb, result) {
            const players = result.data.players;

            // Sheet danh sách
            const data = [['STT', 'Tên VĐV', 'CLB']];
            players.forEach((p, i) => {
                data.push([i + 1, p.name, p.club]);
            });

            // Ma trận đấu
            data.push([]);
            data.push(['MA TRẬN ĐẤU VÒNG TRÒN']);
            const header = ['MS'];
            players.forEach((_, i) => header.push(i + 1));
            data.push(header);

            players.forEach((p, i) => {
                const row = [i + 1];
                players.forEach((_, j) => {
                    if (i === j) row.push('');
                    else if (i < j) row.push(`${i + 1}-${j + 1}`);
                    else row.push('');
                });
                data.push(row);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 6 }, { wch: 25 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws, 'Vong_tron');
        }

        /**
         * Xuất sheet Group (chia bảng)
         */
        function exportGroupSheets(wb, result) {
            const { groups } = result.data;

            groups.forEach((group, gi) => {
                const groupName = String.fromCharCode(65 + gi);
                const data = [];

                // Header
                data.push([`BẢNG ${groupName} (${group.length} VĐV)`]);
                data.push([]);
                data.push(['Stt', '', '', `BẢNG ${groupName}`, '', '', '1', '2', '3', '4', 'Điểm', 'T/B', 'XH']);

                // Danh sách VĐV trong bảng
                group.forEach((p, i) => {
                    const row = [i + 1, '', '', `${p.name} (${p.club})`, '', '', '', '', '', '', '', '', ''];
                    data.push(row);
                });

                // Ma trận đấu
                data.push([]);
                data.push(['MS', '', '', 'VĐV', 'vs', 'VĐV', 'Thời gian', '', 'Bàn', 'Trận', 'KQ']);
                const n = group.length;
                let matchNum = 1;
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        data.push([
                            i + 1, '-', j + 1,
                            `${group[i].name} (${group[i].club})`, '-', `${group[j].name} (${group[j].club})`,
                            '', '', '', matchNum++, ''
                        ]);
                    }
                }

                // Giai đoạn II (nếu có)
                data.push([]);
                data.push([`GIAI ĐOẠN II: BẢNG ${groupName} (Chọn Nhất, nhì)`]);
                data.push([]);
                data.push(['1A', '', '', '', '', '', '', '', '', '', '', '', '']);
                data.push(['', '', '', '', '', '', '', '', '', '', '', '', '']);
                data.push(['2B', '', '', '', '', '', '', '', '', '', '', '', '']);

                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [
                    { wch: 6 }, { wch: 5 }, { wch: 5 }, { wch: 25 }, { wch: 5 },
                    { wch: 25 }, { wch: 12 }, { wch: 5 }, { wch: 6 }, { wch: 6 }, { wch: 8 },
                    { wch: 6 }, { wch: 6 },
                ];
                XLSX.utils.book_append_sheet(wb, ws, `Bang_${groupName}`);
            });
        }

        /**
         * Xuất sheet Lịch thi đấu chung
         */
        function exportScheduleSheet(wb, result) {
            const data = [
                ['LỊCH THI ĐẤU CHUNG - GIẢI BÓNG BÀN SPORTSVN 2026'],
                [],
                ['TT', 'Ngày', 'Nội dung', 'Trận đấu', 'Tổng trận', 'Ghi chú'],
            ];

            if (result.type === 'knockout') {
                const { numSlots, byeSlots } = result.data;
                const rounds = Math.log2(numSlots);
                let matchCount = numSlots / 2;
                for (let r = 1; r <= rounds; r++) {
                    const roundName = getRoundName(r, rounds);
                    data.push([r, '', roundName, '', matchCount, `${numSlots} slot`]);
                    matchCount /= 2;
                }
                data.push([]);
                data.push(['Tổng số trận:', numSlots - 1]);
                data.push(['Số BYE:', byeSlots.length]);
                data.push(['BYE slots:', byeSlots.join(', ')]);
            } else if (result.type === 'group') {
                const { groups } = result.data;
                groups.forEach((g, i) => {
                    const groupName = String.fromCharCode(65 + i);
                    const numMatches = g.length * (g.length - 1) / 2;
                    data.push([i + 1, '', `Bảng ${groupName}`, `${g.length} VĐV`, numMatches, 'Vòng tròn']);
                });
            } else if (result.type === 'roundrobin') {
                const n = result.data.players.length;
                data.push([1, '', 'Vòng tròn', `${n} VĐV`, n * (n - 1) / 2, 'Tất cả gặp nhau']);
            }

            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                { wch: 6 }, { wch: 12 }, { wch: 25 }, { wch: 30 }, { wch: 12 }, { wch: 20 },
            ];
            XLSX.utils.book_append_sheet(wb, ws, 'Lich_thi_dau_chung');
        }

        function getRoundName(round, totalRounds) {
            const remaining = totalRounds - round + 1;
            if (remaining === 1) return 'Chung kết';
            if (remaining === 2) return 'Bán kết';
            if (remaining === 3) return 'Tứ kết';
            if (remaining === 4) return 'Vòng 16';
            if (remaining === 5) return 'Vòng 32';
            if (remaining === 6) return 'Vòng 64';
            if (remaining === 7) return 'Vòng 128';
            return `Vòng ${Math.pow(2, remaining)}`;
        }

        // ============================================================
        // XUẤT JSON (để debug / backup)
        // ============================================================
        function exportJSON() {
            if (!lastResult) return;
            const json = JSON.stringify(lastResult, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BocTham_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // UTILS
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================================
        // INIT
        // ============================================================
        renderPlayers();
    </script>
